          <option value="__new">建立新清單…</option>
          ${pls.map(p => `<option value="${esc(p.id)}"${p.id === opts.playlistId ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select></label>
      <label class="field" id="addNewWrap" hidden><span>新清單名稱</span><input class="input" id="addNewName" placeholder="例如：歌回精選"></label>
      <div class="progress" id="addProg" hidden><div class="bar"><i></i></div><span></span></div>
      <p class="help">支援一般影片、Shorts、youtu.be 短網址和播放清單，一行一個或用空白分隔。之後在頁面任何地方直接按貼上也可以。</p>`,
    foot: `<button class="btn btn-ghost" type="button" data-x="cancel">取消</button><button class="btn btn-light" type="button" data-x="go">${ic('plus')}加入</button>`,
    onKey: e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(); return true; }
      return false;
    },
    init: m => {
      const input = m.$('#addInput'), target = m.$('#addTarget');
      let userPicked = !!opts.playlistId;
      const detect = () => {
        const p = parseYouTubeInput(input.value);
        const lists = p.lists.length + (useHints ? p.listHints.length : 0);
        let html = '';
        if (p.videos.length) html += `<span class="pill">${ic('note')}${p.videos.length} 部影片</span>`;
        if (lists) html += `<span class="pill">${ic('playlist')}${lists} 個播放清單</span>`;
        if (p.listHints.length && !useHints) html += `<button class="link" type="button" data-x="hints" style="color:var(--accent)">這個連結來自播放清單，改成匯入整份清單</button>`;
        if (!html) html = input.value.trim() ? '<span>沒有偵測到 YouTube 連結</span>' : '';
        m.$('#addDetect').innerHTML = html;
        if (!userPicked) target.value = lists ? '__yt' : '';
        m.$('#addNewWrap').hidden = target.value !== '__new';
        m.$('[data-x="go"]').disabled = !(p.videos.length || lists) || busy;
      };
      input.addEventListener('input', detect);
      target.addEventListener('change', () => { userPicked = true; m.$('#addNewWrap').hidden = target.value !== '__new'; if (target.value === '__new') m.$('#addNewName').focus(); });
      m.el.addEventListener('click', e => {
        const b = e.target.closest('[data-x]');
        if (!b) return;
        if (b.dataset.x === 'cancel') m.close();
        else if (b.dataset.x === 'go') go();
        else if (b.dataset.x === 'hints') { useHints = true; detect(); }
      });
      Object.assign(opts, { _go: async () => {
        if (busy) return;
        const p = parseYouTubeInput(input.value);
        if (!p.videos.length && !p.lists.length && !(useHints && p.listHints.length)) { input.focus(); return; }
        if (target.value === '__new' && !m.$('#addNewName').value.trim()) { m.$('#addNewName').focus(); toast('請先輸入新清單的名稱'); return; }
        busy = true;
        m.$('[data-x="go"]').disabled = true;
        const prog = m.$('#addProg');
        prog.hidden = false;
        const res = await importLinks(input.value, {
          target: target.value, newName: m.$('#addNewName').value.trim(), useHints,
          onProgress: (d, n, label) => {
            prog.querySelector('i').style.width = n ? Math.round((d / n) * 100) + '%' : '8%';
            prog.querySelector('span').textContent = label;
          },
        });
        busy = false;
        m.close();
        res.errors.forEach(msg => toast(msg));
        if (!res.total) { toast('沒有加入任何歌曲'); return; }
        const msg = res.added ? `已加入 ${res.added} 首歌曲` : '這些歌曲都已經在音樂庫裡';
        toast(msg + (res.total > res.added && res.added ? `（${res.total - res.added} 首原本就有）` : ''), {
          action: { label: '播放', run: () => playList(res.ids, 0, res.plId ? { type: 'playlist', id: res.plId, name: Lib.playlist(res.plId).name } : { type: 'songs', name: '剛加入的歌曲' }) },
        });
        if (res.plId) Router.go('pl-' + res.plId);
        else if (!Router.cur || !['songs', 'home'].includes(Router.cur.name)) Router.go('songs');
        else rerender();
      } });
      detect();
      if (opts.autostart && input.value.trim()) opts._go();
    },
  });
  function go() { if (opts._go) opts._go(); }
}

function choiceDialog({ title, body, choices }) {
  return new Promise(res => {
    let done = false;
    Modal.open({
      title,
      body: `<p class="confirm-body">${body}</p>`,
      foot: choices.map((c, i) => `<button class="btn ${c.cls || ''}" type="button" data-c="${i}">${esc(c.label)}</button>`).join(''),
      onClose: () => { if (!done) res(null); },
      init: m => $$('[data-c]', m.el).forEach(b => b.addEventListener('click', () => { done = true; res(choices[+b.dataset.c].value); m.close(); })),
    });
  });
}

async function importData(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('這不是有效的備份檔'); return; }
  if (!data || !['sashimusic', 'liner'].includes(data.app) || !data.store || typeof data.store !== 'object') { toast(`這不是${APP.name}的備份檔`); return; }
  const src = data.store;
  const nSongs = Array.isArray(src.order) ? src.order.length : 0;
  const nPl = Array.isArray(src.playlists) ? src.playlists.length : 0;
  const mode = await choiceDialog({
    title: '匯入備份',
    body: `備份裡有 ${nSongs} 首歌曲、${nPl} 份播放清單。要合併到目前的音樂庫，還是整個取代？`,
    choices: [{ label: '取消', value: null, cls: 'btn-ghost' }, { label: '取代全部', value: 'replace', cls: 'btn-danger' }, { label: '合併', value: 'merge', cls: 'btn-light' }],
  });
  if (!mode) return;
  const lyrics = data.lyrics && typeof data.lyrics === 'object' ? data.lyrics : {};
  if (mode === 'replace') {
    const key = S().apiKey;
    await KV.clear('lyr:');
    for (const [k, v] of Object.entries(lyrics)) if (k.startsWith('lyr:')) await KV.set(k, v);
    const next = { ...Store.defaults(), ...src, settings: { ...Store.defaults().settings, ...(src.settings || {}), apiKey: key } };
    Store.save = () => {};
    try { localStorage.setItem(Store.KEY, JSON.stringify(next)); } catch (e) { toast('無法寫入：瀏覽器儲存空間不足'); return; }
    location.reload();
    return;
  }
  const d = Store.data;
  for (const [id, s] of Object.entries(src.songs || {})) if (s && !d.songs[id]) d.songs[id] = s;
  d.order = unique([...d.order, ...(src.order || [])]);
  d.likes = unique([...d.likes, ...(src.likes || [])]);
  const have = new Set(d.playlists.map(p => p.id));
  for (const p of src.playlists || []) if (p && p.id && !have.has(p.id)) d.playlists.push(p);
  d.history = [...d.history, ...(src.history || [])].filter(h => h && h.id).sort((a, b) => b.t - a.t).slice(0, 300);
  for (const [k, v] of Object.entries(lyrics)) if (k.startsWith('lyr:') && !(await KV.get(k))) await KV.set(k, v);
  Store.prune();
  Lib.sync();
  Store.write();
  renderSidebar();
  rerender();
  toast(`匯入完成：音樂庫現在有 ${d.order.length} 首歌曲`);
}

/* ---------- Layout helpers & loops ---------- */

function updateBottomVars() {
  const pb = $('#playerbar');
  if (!pb) return;
  const r = pb.getBoundingClientRect();
  const v = Math.max(0, Math.round(window.innerHeight - r.top));
  document.documentElement.style.setProperty('--bottom-ui', v + 'px');
}

function frame() {
  const t = Player.time();
  Bar.time(t, Player.duration());
  Lyrics.tick(t);
  syncDock();
  if (PiP.win) PiP.update();
  requestAnimationFrame(frame);
}

let slowTicks = 0;
function slowTick() {
  Sleep.tick();
  if (++slowTicks % 5 === 0 && Player.isPlaying()) {
    Store.data.queue.pos = Math.floor(Player.time());
    Store.save();
  }
}

/* ---------- Events ---------- */

let drag = null;
function clearDropMarks() { $$('.drop-before, .drop-after, .nav-item.drop').forEach(el => el.classList.remove('drop-before', 'drop-after', 'drop')); }

function bindEvents() {
  window.addEventListener('hashchange', onRoute);

  /* Missing thumbnails (deleted videos, offline) shouldn't show the broken-image icon */
  document.addEventListener('error', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG') t.style.visibility = 'hidden';
  }, true);
  document.addEventListener('load', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.style.visibility) t.style.visibility = '';
  }, true);

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t) {
      const act = t.dataset.act;
      const fn = Actions[act];
      if (!fn) return;
      const row = t.closest('[data-row]');
      e.preventDefault();
      fn({ el: t, id: t.dataset.id || (row && row.dataset.row), row, e });
      return;
    }
    if (coarse() && !e.target.closest('a, button, input, select, textarea')) {
      const row = e.target.closest('.trow[data-row], .qrow[data-row]');
      if (row) {
        if (row.classList.contains('qrow')) Queue.playAt(+row.dataset.qi);
        else rowPlay({ id: row.dataset.row, row });
      }
    }
  });

  document.addEventListener('dblclick', e => {
    const row = e.target.closest('.trow[data-row], .qrow[data-row]');
    if (!row || e.target.closest('button, a, input')) return;
    if (row.classList.contains('qrow')) Queue.playAt(+row.dataset.qi);
    else rowPlay({ id: row.dataset.row, row });
  });

  document.addEventListener('contextmenu', e => {
    if (e.target.closest('input, textarea, .modal, .ly-lines')) return;
    const row = e.target.closest('[data-row]');
    if (!row) return;
    e.preventDefault();
    openSongMenu(row.dataset.row, { x: e.clientX, y: e.clientY }, row);
  });

  /* Mouse clicks shouldn't leave focus on transport buttons (Space would press them again) */
  document.addEventListener('mousedown', e => {
    const b = e.target.closest('button');
    if (b && !b.closest('.modal, .menu')) e.preventDefault();
  });

  document.addEventListener('pointerdown', e => {
    if (Menu.isOpen && !e.target.closest('.menu')) Menu.close();
  }, true);
  $('#main').addEventListener('scroll', () => { if (Menu.isOpen) Menu.close(); }, { passive: true });
  window.addEventListener('resize', () => Menu.close());

  document.addEventListener('keydown', onKey);

  document.addEventListener('paste', e => {
    if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
    if (Modal.top) return;
    const text = e.clipboardData && e.clipboardData.getData('text');
    const p = parseYouTubeInput(text);
    if (p.videos.length || p.lists.length) { e.preventDefault(); openAdd(text, {}); }
  });

  document.addEventListener('dragstart', e => {
    const row = e.target.closest && e.target.closest('[data-row][draggable="true"]');
    if (!row) return;
    const list = row.closest('[data-list]');
    drag = { id: row.dataset.row, list: list ? list.dataset.list : '', index: +(row.dataset.qi != null ? row.dataset.qi : row.dataset.i) };
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData('text/plain', ytWatch(drag.id));
    row.classList.add('dragging');
  });
  document.addEventListener('dragend', () => {
    $$('.dragging').forEach(el => el.classList.remove('dragging'));
    clearDropMarks();
    drag = null;
  });
  document.addEventListener('dragover', e => {
    if (!drag) {
      if (e.dataTransfer && !e.target.closest('input, textarea') && [...e.dataTransfer.types].some(t => t === 'text/uri-list' || t === 'text/plain')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }
      return;
    }
    const nav = e.target.closest && e.target.closest('[data-drop-pl]');
    if (nav) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      clearDropMarks();
      nav.classList.add('drop');
      return;
    }
    const row = e.target.closest && e.target.closest('[data-row]');
    const list = row && row.closest('[data-reorder]');
    if (row && list && list.dataset.list === drag.list && row.getAttribute('draggable') === 'true') {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = row.getBoundingClientRect();
      clearDropMarks();
      row.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
    }
  });
  document.addEventListener('drop', e => {
    if (!drag) {
      if (e.target.closest && e.target.closest('input, textarea')) return;
      const text = e.dataTransfer && (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain'));
      const p = parseYouTubeInput(text);
      if (p.videos.length || p.lists.length) { e.preventDefault(); openAdd(text, { autostart: true }); }
      return;
    }
    const nav = e.target.closest && e.target.closest('[data-drop-pl]');
    if (nav) { e.preventDefault(); addToPlaylist(nav.dataset.dropPl, [drag.id]); clearDropMarks(); return; }
    const row = e.target.closest && e.target.closest('[data-row]');
    const list = row && row.closest('[data-reorder]');
    if (row && list && list.dataset.list === drag.list) {
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      const idx = +(row.dataset.qi != null ? row.dataset.qi : row.dataset.i);
      moveItem(drag.list, drag.index, idx + (after ? 1 : 0));
    }
    clearDropMarks();
  });

  const q = $('#q');
  q.addEventListener('input', () => {
    Search.q = q.value;
    if (!Router.cur || Router.cur.name !== 'search') Router.go('search'); else rerender();
  });
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const p = parseYouTubeInput(q.value);
    if (p.videos.length || p.lists.length) openAdd(q.value, { autostart: true });
    else runYouTubeSearch();
  });
  q.addEventListener('focus', () => { if (NP.isOpen) NP.close(); });

  const seek = $('#seek');
  seek.addEventListener('input', () => {
    Bar.seeking = true;
    seek.classList.add('dragging');
    const d = Player.duration();
    $('#tCur').textContent = fmtTime((+seek.value / 1000) * d);
    seek.style.setProperty('--p', (+seek.value / 10).toFixed(1) + '%');
  });
  seek.addEventListener('change', () => {
    const d = Player.duration();
    if (d) Player.seek((+seek.value / 1000) * d);
    Bar.seeking = false;
    seek.classList.remove('dragging');
    Lyrics.userScrollUntil = 0;
  });
  seek.addEventListener('pointerup', () => setTimeout(() => { Bar.seeking = false; seek.classList.remove('dragging'); }, 60));

  const vol = $('#vol');
  vol.addEventListener('input', () => Player.setVolume(+vol.value));
  $('#volumeBox').addEventListener('wheel', e => {
    e.preventDefault();
    Player.setVolume((S().muted ? 0 : S().volume) + (e.deltaY < 0 ? 5 : -5));
  }, { passive: false });

  const ls = $('#lyScroll');
  ['wheel', 'touchmove'].forEach(ev => ls.addEventListener(ev, () => Lyrics.userScrolled(), { passive: true }));
  $('#lyLines').addEventListener('click', e => {
    const el = e.target.closest('.ly-line[data-i]');
    if (el && !e.target.closest('button')) Lyrics.clickLine(el);
  });

  document.addEventListener('change', e => {
    if (e.target.id === 'sortSel') { S().sort = e.target.value; Store.save(); rerender(); }
  });
  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.dataset && f.dataset.form === 'welcome') {
      e.preventDefault();
      const v = $('#welcomeInput').value;
      if (v.trim()) openAdd(v, { autostart: true }); else $('#welcomeInput').focus();
    }
  });
  $('#importFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) importData(f);
    e.target.value = '';
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Lyrics.sync(false); });
  window.addEventListener('pagehide', () => {
    if (Player.id && Player.ready) Store.data.queue.pos = Math.floor(Player.time());
    Store.write();
  });
}

function moveItem(listKey, from, to) {
  if (listKey === 'queue') { Queue.move(from, to); return; }
  if (!listKey.startsWith('pl:')) return;
  const p = Lib.playlist(listKey.slice(3));
  if (!p || from === to || from + 1 === to) return;
  const [id] = p.songs.splice(from, 1);
  if (to > from) to--;
  p.songs.splice(to, 0, id);
  p.updated = Date.now();
  Store.save();
  rerender();
}

function onKey(e) {
  const top = Modal.top;
  if (top && top.onKey && top.onKey(e)) return;
  if (Menu.isOpen) { if (e.key === 'Escape') { e.preventDefault(); Menu.close(); } return; }
  if (top) { if (e.key === 'Escape') { e.preventDefault(); top.close(); } return; }
  const t = e.target;
  const typing = t && t.matches && t.matches('input:not([type=range]):not([type=checkbox]), textarea, select, [contenteditable="true"]');
  if (typing) { if (e.key === 'Escape') t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusSearch(); }
    return;
  }
  const k = e.key;
  if (k === ' ') {
    if (t && t.closest && t.closest('button, a, [role="tab"], summary')) return;
    e.preventDefault();
    Player.toggle();
    return;
  }
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    if (t && t.type === 'range') return;
    e.preventDefault();
    if (e.shiftKey) { if (k === 'ArrowRight') Queue.next(); else Queue.prev(); }
    else Player.seek(Player.time() + (k === 'ArrowRight' ? 5 : -5));
    return;
  }
  if ((k === 'ArrowUp' || k === 'ArrowDown') && e.shiftKey) {
    e.preventDefault();
    Player.setVolume((S().muted ? 0 : S().volume) + (k === 'ArrowUp' ? 5 : -5));
    return;
  }
  if (k === 'Escape') {
    if (NP.isOpen) NP.close();
    else if (Drawer.open) Drawer.toggle(false);
    return;
  }
  if (k === '?') { openShortcuts(); return; }
  if (k === '/') { e.preventDefault(); focusSearch(); return; }
  if (k === '[' || k === ']') { Lyrics.adjustOffset(k === ']' ? 0.1 : -0.1); return; }
  switch (k.toLowerCase()) {
    case 'm': Player.setMuted(!S().muted); toast(S().muted ? '已靜音' : '取消靜音'); break;
    case 's': Queue.toggleShuffle(); break;
    case 'r': Queue.cycleRepeat(); break;
    case 'l': NP.toggle('lyrics'); break;
    case 'q': Actions.queue({}); break;
    case 'f': NP.toggle(); break;
    default: return;
  }
}

function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) { /* unsupported action */ } };
  set('play', () => Player.play());
  set('pause', () => Player.pause());
  set('previoustrack', () => Queue.prev());
  set('nexttrack', () => Queue.next());
  set('seekto', d => { if (d && d.seekTime != null) Player.seek(d.seekTime); });
}

/* ---------- Start ---------- */

function init() {
  Store.load();
  Lib.sync();
  renderSidebar();
  Bar.modes();
  Bar.volume();
  Bar.speed();
  Bar.sleep();
  bindEvents();
  initMediaSession();
  if (location.protocol === 'file:') Banner.show('file', FILE_MSG);
  const cur = Queue.current();
  if (cur && song(cur)) {
    Bar.track(song(cur));
    Player.load(cur, Store.data.queue.pos || 0, false);
    NP.render();
    Lyrics.load(cur);
    $('#miniVideo').hidden = !S().showVideo;
  } else {
    Bar.track(null);
    Lyrics.render();
  }
  Player.init();
  onRoute();
  if (window.ResizeObserver) new ResizeObserver(updateBottomVars).observe($('#playerbar'));
  window.addEventListener('resize', updateBottomVars);
  updateBottomVars();
  requestAnimationFrame(frame);
  setInterval(slowTick, 1000);
  if (S().autoTrans) {
    Store.data.order.forEach(id => {
      const s = song(id);
      if (s && s.title !== s.id && (s.trans == null || s.transTl !== S().tl)) TransQ.push(id);
    });
  }
}

init();

})();
</script>

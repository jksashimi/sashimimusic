/* =====================================================================
   Network services: LRCLIB lyrics, translation, video metadata,
   optional YouTube Data API.
   ===================================================================== */

const Net = {
  async json(url, opts = {}, timeout = 12000) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), timeout);
    try {
      const r = await fetch(url, { ...opts, signal: ac.signal });
      if (!r.ok) {
        const err = new Error('HTTP ' + r.status);
        err.status = r.status;
        err.retryAfter = r.headers.get('Retry-After');
        throw err;
      }
      return await r.json();
    } finally {
      clearTimeout(timer);
    }
  },
};

/* Run async jobs one at a time with a gap between them (polite to free APIs) */
function makeSerial(gapMs) {
  let chain = Promise.resolve();
  return fn => {
    const p = chain.then(fn, fn);
    chain = p.catch(() => {}).then(() => sleep(gapMs));
    return p;
  };
}

/* ---------- LRCLIB (https://lrclib.net) ---------- */

const LRCLIB = {
  base: 'https://lrclib.net/api',
  useHeader: true,
  serial: makeSerial(300),
  req(path, params) {
    const url = this.base + path + (params ? '?' + new URLSearchParams(params) : '');
    return this.serial(async () => {
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const opts = this.useHeader ? { headers: { 'Lrclib-Client': `${APP.id} ${APP.version} (self-hosted YouTube lyrics player)` } } : {};
          return await Net.json(url, opts);
        } catch (e) {
          if (e.status === 404) return null;
          if (e.name === 'TypeError' && this.useHeader) { this.useHeader = false; continue; }
          if (e.status === 429 && attempt < 2) {
            await sleep(Math.min(20, +e.retryAfter || 3) * 1000 * (1 + Math.random() * 0.3));
            continue;
          }
          throw e;
        }
      }
      return null;
    });
  },
  async search(params) {
    const r = await this.req('/search', params);
    return Array.isArray(r) ? r : [];
  },
  byId(id) { return this.req('/get/' + encodeURIComponent(id)); },
};

async function findLyrics(s, dur) {
  const { track, artist } = lyricQuery(s);
  if (!track) return null;
  const tries = [];
  if (artist) tries.push({ track_name: track, artist_name: artist });
  tries.push({ track_name: track });
  tries.push({ q: artist ? `${track} ${artist}` : track });
  const seen = new Map();
  let lastErr = null, ok = false;
  for (const p of tries) {
    try {
      const res = await LRCLIB.search(p);
      ok = true;
      res.forEach(r => seen.set(r.id, r));
      const best = pickLyric([...seen.values()], track, artist, dur, 85);
      if (best && best.rec.syncedLyrics) return best.rec;
    } catch (e) { lastErr = e; }
  }
  if (!ok && lastErr) throw lastErr;
  const best = pickLyric([...seen.values()], track, artist, dur);
  return best ? best.rec : null;
}

function recFromLrclib(r) {
  return {
    kind: r.syncedLyrics ? 'synced' : r.plainLyrics ? 'plain' : r.instrumental ? 'instrumental' : 'none',
    lrc: r.syncedLyrics || '',
    plain: r.plainLyrics || '',
    source: 'lrclib',
    lrclibId: r.id,
    track: r.trackName || r.name || '',
    artist: r.artistName || '',
    album: r.albumName || '',
    duration: r.duration || 0,
    at: Date.now(),
  };
}

/* ---------- Translation ----------
   Primary: Google's public web-client endpoint (no key, may rate-limit).
   Fallback for short titles: MyMemory (free, ~5,000 characters/day per IP). */

const MM_CODES = { ja: 'ja', ko: 'ko', zh: 'zh-CN', en: 'en' };

const Translate = {
  serial: makeSerial(220),
  gtx(text, tl) {
    return this.serial(async () => {
      const url = 'https://translate.googleapis.com/translate_a/single?' + new URLSearchParams({ client: 'gtx', sl: 'auto', tl, dt: 't', q: text });
      const j = await Net.json(url, {}, 10000);
      const out = (Array.isArray(j && j[0]) ? j[0] : []).map(x => (x && x[0]) || '').join('');
      return { text: out, src: (j && j[2]) || '' };
    });
  },
  mymemory(text, tl) {
    return this.serial(async () => {
      const sl = MM_CODES[detectScript(text)];
      if (!sl) throw new Error('無法判斷原文語言');
      if (sameLang(sl, tl) && !(sl === 'zh-CN' && tl === 'zh-TW')) return { text, src: sl };
      const url = 'https://api.mymemory.translated.net/get?' + new URLSearchParams({ q: text.slice(0, 450), langpair: `${sl}|${tl}` });
      const j = await Net.json(url, {}, 10000);
      const out = j && j.responseData && j.responseData.translatedText;
      if (+j.responseStatus !== 200 || !out || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(out)) throw new Error((j && j.responseDetails) || '翻譯失敗');
      return { text: decodeEntities(out), src: sl };
    });
  },
  async title(text, tl) {
    try { return await this.gtx(text, tl); }
    catch (e) { return await this.mymemory(text, tl); }
  },
};

async function translateLines(lines, tl) {
  const out = new Array(lines.length).fill('');
  const idx = [];
  lines.forEach((l, i) => { if (l && l.trim()) idx.push(i); });
  const chunks = [];
  let chunk = [], len = 0;
  for (const i of idx) {
    const L = lines[i].length + 1;
    if (len + L > 420 && chunk.length) { chunks.push(chunk); chunk = []; len = 0; }
    chunk.push(i); len += L;
  }
  if (chunk.length) chunks.push(chunk);
  for (const c of chunks) {
    const r = await Translate.gtx(c.map(i => lines[i].replace(/\s*\n\s*/g, ' ')).join('\n'), tl);
    let parts = r.text.split('\n');
    if (parts.length !== c.length) {
      parts = [];
      for (const i of c) parts.push((await Translate.gtx(lines[i], tl)).text);
    }
    c.forEach((i, k) => {
      const t = (parts[k] || '').trim();
      out[i] = norm(t) === norm(lines[i]) ? '' : t;
    });
  }
  return out;
}

/* Background queue that fills in translated titles */
const TransQ = {
  q: [],
  force: new Set(),
  running: false,
  fails: 0,
  push(id, force = false) {
    if (force) this.force.add(id);
    if (!this.q.includes(id)) this.q.push(id);
    this.run();
  },
  async run() {
    if (this.running) return;
    this.running = true;
    while (this.q.length) {
      const id = this.q.shift();
      const s = song(id);
      if (!s || !s.title || s.title === s.id) continue;
      const tl = S().tl;
      const force = this.force.delete(id);
      if (!force && s.transManual && s.transTl === tl) continue;
      if (!force && s.trans != null && s.transTl === tl && s.transOf === s.title) continue;
      try {
        const r = await Translate.title(s.title, tl);
        if (r.src) s.lang = r.src;
        s.transTl = tl;
        s.transOf = s.title;
        const t = (r.text || '').trim();
        s.trans = sameLang(r.src, tl) || norm(t) === norm(s.title) ? '' : t;
        delete s.transManual;
        this.fails = 0;
        Store.save();
        App.songChanged(id);
      } catch (e) {
        this.fails++;
        if (this.fails >= 3) {
          this.q.length = 0;
          this.fails = 0;
          toast('翻譯服務暫時無法連線，之後會再試一次');
          break;
        }
        await sleep(1200);
      }
    }
    this.running = false;
  },
};

/* ---------- Video metadata ---------- */

async function fetchMeta(id) {
  if (S().apiKey) {
    try {
      const m = await YTData.videos([id]);
      if (m[id]) return m[id];
    } catch (e) { console.warn('YouTube Data API', e); }
  }
  const url = ytWatch(id);
  try {
    const j = await Net.json('https://noembed.com/embed?' + new URLSearchParams({ url }), {}, 8000);
    if (j && j.title && !j.error) return { rawTitle: j.title, channel: j.author_name || '' };
  } catch (e) { /* try next source */ }
  try {
    const j = await Net.json('https://www.youtube.com/oembed?' + new URLSearchParams({ url, format: 'json' }), {}, 8000);
    if (j && j.title) return { rawTitle: j.title, channel: j.author_name || '' };
  } catch (e) { /* try next source */ }
  try { return await metaViaPlayer(id); } catch (e) { return null; }
}

/* ---------- YouTube Data API v3 (optional key) ---------- */

const YTData = {
  async call(path, params) {
    const key = S().apiKey;
    if (!key) throw new Error('NO_KEY');
    const r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + new URLSearchParams({ ...params, key }));
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error((j.error && j.error.message) || 'HTTP ' + r.status);
    return j;
  },
  async videos(ids) {
    const out = {};
    for (let i = 0; i < ids.length; i += 50) {
      const j = await this.call('videos', { part: 'snippet,contentDetails,status', id: ids.slice(i, i + 50).join(','), maxResults: 50 });
      for (const v of j.items || []) {
        out[v.id] = {
          rawTitle: v.snippet.title,
          channel: v.snippet.channelTitle,
          duration: isoDur(v.contentDetails && v.contentDetails.duration),
          embeddable: !(v.status && v.status.embeddable === false),
        };
      }
    }
    return out;
  },
  async search(q) {
    const j = await this.call('search', { part: 'snippet', type: 'video', videoEmbeddable: 'true', maxResults: 20, q });
    const items = (j.items || []).filter(x => x.id && x.id.videoId).map(x => ({
      id: x.id.videoId, rawTitle: decodeEntities(x.snippet.title), channel: decodeEntities(x.snippet.channelTitle), duration: 0,
    }));
    if (items.length) {
      try {
        const meta = await this.videos(items.map(x => x.id));
        items.forEach(x => { if (meta[x.id]) x.duration = meta[x.id].duration; });
      } catch (e) { /* durations are optional */ }
    }
    return items;
  },
  async playlist(listId) {
    let title = '';
    try {
      const p = await this.call('playlists', { part: 'snippet', id: listId });
      title = (p.items && p.items[0] && p.items[0].snippet.title) || '';
    } catch (e) { /* title is optional */ }
    const items = [];
    let pageToken = '';
    do {
      const j = await this.call('playlistItems', { part: 'snippet,contentDetails', playlistId: listId, maxResults: 50, ...(pageToken ? { pageToken } : {}) });
      for (const it of j.items || []) {
        const vid = it.contentDetails && it.contentDetails.videoId;
        const t = it.snippet && it.snippet.title;
        if (!vid || t === 'Deleted video' || t === 'Private video') continue;
        items.push({ id: vid, rawTitle: t, channel: it.snippet.videoOwnerChannelTitle || '' });
      }
      pageToken = j.nextPageToken || '';
    } while (pageToken && items.length < 1000);
    return { title, items };
  },
};

/* Expand a YouTube playlist id into video ids (with titles when the API key is set) */
async function resolvePlaylist(listId) {
  if (S().apiKey) {
    try {
      const r = await YTData.playlist(listId);
      const known = {};
      r.items.forEach(x => { known[x.id] = { rawTitle: x.rawTitle, channel: x.channel }; });
      return { title: r.title, ids: r.items.map(x => x.id), known };
    } catch (e) { console.warn('playlist via API', e); }
  }
  let title = '';
  try {
    const j = await Net.json('https://noembed.com/embed?' + new URLSearchParams({ url: 'https://www.youtube.com/playlist?list=' + listId }), {}, 8000);
    if (j && j.title && !j.error) title = j.title;
  } catch (e) { /* optional */ }
  const ids = await playlistViaPlayer(listId);
  return { title, ids, known: {} };
}

/* =====================================================================
   YouTube player engine, play queue, sleep timer.
   ===================================================================== */

let ytReadyResolve;
const ytReady = new Promise(r => { ytReadyResolve = r; });

const Player = {
  yt: null,
  ready: false,
  failed: false,
  state: -1,
  id: null,
  pending: null,
  raw: 0,
  rawAt: 0,
  lastRaw: -1,
  rate: 1,

  init() {
    window.onYouTubeIframeAPIReady = () => { ytReadyResolve(); this.create(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = () => this.fail();
    document.head.appendChild(s);
    setTimeout(() => { if (!window.YT || !window.YT.Player) this.fail(); }, 15000);
  },
  fail() {
    if (this.failed || this.ready) return;
    this.failed = true;
    Banner.show('yt', `<strong>無法載入 YouTube 播放器。</strong> 請確認網路連線，或暫時關閉會封鎖 youtube.com 腳本的擴充功能，然後重新整理頁面。`);
  },
  create() {
    const origin = location.origin && location.origin !== 'null' ? location.origin : undefined;
    this.yt = new YT.Player('ytPlayer', {
      width: '100%',
      height: '100%',
      playerVars: { playsinline: 1, controls: 0, rel: 0, iv_load_policy: 3, fs: 0, disablekb: 1, cc_load_policy: 0, ...(origin ? { origin } : {}) },
      events: {
        onReady: () => this.onReady(),
        onStateChange: e => this.onState(e.data),
        onError: e => App.onPlayerError(e.data),
        onPlaybackRateChange: e => { this.rate = e.data || 1; Bar.speed(); },
      },
    });
  },
  onReady() {
    this.ready = true;
    Banner.hide('yt');
    const st = S();
    this.yt.setVolume(st.volume);
    if (st.muted) this.yt.mute(); else this.yt.unMute();
    if (this.pending) {
      const p = this.pending;
      this.pending = null;
      this.load(p.id, p.start, p.autoplay);
    }
  },
  onState(s) {
    this.state = s;
    if (s === 1) {
      this.rawAt = performance.now();
      if (this.rate !== S().rate && S().rate !== 1) this.setRate(S().rate, true);
      App.onPlaying();
    } else if (s === 0) {
      App.onEnded();
    }
    Bar.playState();
  },
  load(id, start = 0, autoplay = true) {
    this.id = id;
    this.raw = start || 0;
    this.rawAt = performance.now();
    this.lastRaw = -1;
    if (!this.ready) { this.pending = { id, start, autoplay }; return; }
    const opts = { videoId: id, startSeconds: Math.max(0, start || 0) };
    if (autoplay) this.yt.loadVideoById(opts); else this.yt.cueVideoById(opts);
    this.state = autoplay ? 3 : 5;
    Bar.playState();
  },
  play() {
    if (!this.ready) { if (this.pending) this.pending.autoplay = true; return; }
    if (!this.id) return;
    this.yt.playVideo();
  },
  pause() { if (this.ready) this.yt.pauseVideo(); },
  toggle() {
    if (!this.id) {
      const q = Store.data.queue;
      if (q.ids.length) { if (q.index < 0) q.index = 0; startCurrent(true); }
      else if (Store.data.order.length) playList(Store.data.order, 0, { type: 'songs', name: '歌曲' });
      return;
    }
    if (this.isPlaying()) this.pause(); else this.play();
  },
  isPlaying() { return this.state === 1 || this.state === 3; },
  seek(t) {
    if (!this.ready || !this.id) return;
    const d = this.duration();
    t = Math.max(0, d ? Math.min(t, d - 0.25) : t);
    this.yt.seekTo(t, true);
    this.raw = t;
    this.rawAt = performance.now();
  },
  /* getCurrentTime() only refreshes a few times a second; interpolate between updates for smooth lyrics */
  time() {
    if (!this.ready || !this.yt || !this.yt.getCurrentTime) return this.raw;
    const r = this.yt.getCurrentTime() || 0;
    const now = performance.now();
    if (r !== this.lastRaw) { this.lastRaw = r; this.raw = r; this.rawAt = now; }
    if (this.state === 1) return Math.min(this.raw + ((now - this.rawAt) / 1000) * this.rate, this.raw + 1.5);
    return this.raw;
  },
  duration() {
    const d = this.ready && this.yt && this.yt.getDuration ? this.yt.getDuration() : 0;
    return d || (song(this.id) && song(this.id).duration) || 0;
  },
  videoData() {
    try { return this.yt && this.yt.getVideoData ? this.yt.getVideoData() : null; } catch (e) { return null; }
  },
  setVolume(v) {
    v = clamp(Math.round(v), 0, 100);
    S().volume = v;
    if (this.ready) this.yt.setVolume(v);
    if (v > 0 && S().muted) this.setMuted(false);
    Store.save();
    Bar.volume();
  },
  setMuted(m) {
    S().muted = m;
    if (this.ready) { if (m) this.yt.mute(); else this.yt.unMute(); }
    Store.save();
    Bar.volume();
  },
  rates() {
    try {
      const r = this.ready && this.yt.getAvailablePlaybackRates();
      if (r && r.length) return r;
    } catch (e) { /* fall through */ }
    return [0.5, 0.75, 1, 1.25, 1.5, 2];
  },
  setRate(r, silent) {
    S().rate = r;
    if (this.ready) this.yt.setPlaybackRate(r);
    this.rate = r;
    Store.save();
    Bar.speed();
    if (!silent) toast(`播放速度 ${r}×`);
  },
};

/* Hidden, throwaway players used to read titles or playlist contents without an API key */
function helperPlayer(cfg, onReady, timeoutMs = 12000) {
  const apiReady = Promise.race([ytReady, sleep(15000).then(() => { throw new Error('YouTube 播放器沒有載入'); })]);
  return apiReady.then(() => new Promise((resolve, reject) => {
    const host = document.createElement('div');
    host.className = 'yt-helper';
    const inner = document.createElement('div');
    host.appendChild(inner);
    document.body.appendChild(host);
    let p = null, done = false;
    const finish = (fn, v) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { if (p) p.destroy(); } catch (e) { /* ignore */ }
      host.remove();
      fn(v);
    };
    const timer = setTimeout(() => finish(reject, new Error('timeout')), timeoutMs);
    const origin = location.origin && location.origin !== 'null' ? location.origin : undefined;
    p = new YT.Player(inner, {
      width: 200, height: 200,
      ...cfg,
      playerVars: { ...(origin ? { origin } : {}), ...(cfg.playerVars || {}) },
      events: {
        onReady: e => onReady(e.target, v => finish(resolve, v), err => finish(reject, err)),
        onError: e => finish(reject, new Error('YouTube error ' + e.data)),
      },
    });
  }));
}

function metaViaPlayer(id) {
  return helperPlayer({ videoId: id }, (p, ok, fail) => {
    const t0 = Date.now();
    const poll = () => {
      const d = p.getVideoData && p.getVideoData();
      if (d && d.title) ok({ rawTitle: d.title, channel: d.author || '', duration: Math.round(p.getDuration() || 0) });
      else if (Date.now() - t0 > 7000) fail(new Error('no data'));
      else setTimeout(poll, 250);
    };
    poll();
  });
}

function playlistViaPlayer(listId) {
  return helperPlayer({ playerVars: { listType: 'playlist', list: listId } }, (p, ok, fail) => {
    const t0 = Date.now();
    const poll = () => {
      const ids = p.getPlaylist && p.getPlaylist();
      if (ids && ids.length) ok(ids.slice());
      else if (Date.now() - t0 > 9000) fail(new Error('playlist empty or private'));
      else setTimeout(poll, 300);
    };
    poll();
  }, 15000);
}

/* ---------- Play queue ---------- */

const Queue = {
  get q() { return Store.data.queue; },
  current() { const q = this.q; return q.ids[q.index] || null; },
  set(ids, start, ctx, shuffle) {
    const q = this.q;
    ids = ids.filter(id => song(id));
    if (!ids.length) return false;
    start = clamp(start | 0, 0, ids.length - 1);
    if (shuffle !== undefined) q.shuffle = shuffle;
    q.ordered = ids.slice();
    q.ctx = ctx || null;
    if (q.shuffle) {
      const first = ids[start];
      const rest = ids.slice();
      rest.splice(start, 1);
      q.ids = [first, ...shuffleInPlace(rest)];
      q.index = 0;
    } else {
      q.ids = ids.slice();
      q.index = start;
    }
    return true;
  },
  next(auto = false) {
    const q = this.q;
    if (!q.ids.length) return;
    if (auto && q.repeat === 'one') { Player.seek(0); Player.play(); return; }
    let i = q.index + 1;
    if (i >= q.ids.length) {
      if (q.repeat === 'all') {
        i = 0;
        if (q.shuffle && q.ids.length > 2) {
          const cur = q.ids[q.index];
          const rest = shuffleInPlace(q.ids.filter((x, k) => k !== q.index));
          q.ids = [...rest.slice(0, 1), ...rest.slice(1), cur].filter(Boolean);
        }
      } else {
        if (!auto) toast('已經是佇列的最後一首');
        return;
      }
    }
    q.index = i;
    startCurrent(true);
  },
  prev() {
    const q = this.q;
    if (!q.ids.length) return;
    if (Player.time() > 3 || (q.index === 0 && q.repeat !== 'all')) { Player.seek(0); return; }
    q.index = q.index > 0 ? q.index - 1 : q.ids.length - 1;
    startCurrent(true);
  },
  playAt(i) {
    const q = this.q;
    if (i < 0 || i >= q.ids.length) return;
    q.index = i;
    startCurrent(true);
  },
  /* Play a song right away without throwing away the rest of the queue */
  playNow(id) {
    const q = this.q;
    if (!song(id)) return;
    if (q.index < 0 || !q.ids.length) { playSingle(id); return; }
    if (q.ids[q.index] === id) { if (Player.id === id) Player.play(); else startCurrent(true); return; }
    q.ids.splice(q.index + 1, 0, id);
    const oi = q.ordered.indexOf(q.ids[q.index]);
    q.ordered.splice(oi + 1, 0, id);
    q.index++;
    startCurrent(true);
  },
  /* Move past a track that failed to play (ignores repeat-one) */
  skip() {
    const q = this.q;
    if (q.index + 1 < q.ids.length) { q.index++; startCurrent(true); }
    else if (q.repeat === 'all' && q.ids.length > 1) { q.index = 0; startCurrent(true); }
  },
  addNext(ids) {
    const q = this.q;
    ids = ids.filter(id => song(id));
    if (!ids.length) return;
    if (q.index < 0 || !q.ids.length) { playList(ids, 0, { type: 'queue', name: '播放佇列' }); return; }
    q.ids.splice(q.index + 1, 0, ...ids);
    const oi = q.ordered.indexOf(q.ids[q.index]);
    q.ordered.splice(oi + 1, 0, ...ids);
    Store.save();
    App.queueChanged();
    toast(ids.length > 1 ? `已將 ${ids.length} 首排在下一首` : '已排在下一首播放');
  },
  addEnd(ids) {
    const q = this.q;
    ids = ids.filter(id => song(id));
    if (!ids.length) return;
    if (q.index < 0 || !q.ids.length) { playList(ids, 0, { type: 'queue', name: '播放佇列' }); return; }
    q.ids.push(...ids);
    q.ordered.push(...ids);
    Store.save();
    App.queueChanged();
    toast(ids.length > 1 ? `已將 ${ids.length} 首加入佇列` : '已加入佇列');
  },
  removeAt(i) {
    const q = this.q;
    if (i === q.index || i < 0 || i >= q.ids.length) return;
    const [id] = q.ids.splice(i, 1);
    const oi = q.ordered.lastIndexOf(id);
    if (oi >= 0) q.ordered.splice(oi, 1);
    if (i < q.index) q.index--;
    Store.save();
    App.queueChanged();
  },
  move(from, to) {
    const q = this.q;
    if (from === q.index || from < 0 || from >= q.ids.length) return;
    let cur = q.index;
    const [id] = q.ids.splice(from, 1);
    if (from < cur) cur--;
    if (to > from) to--;
    to = clamp(to, cur + 1, q.ids.length);
    q.ids.splice(to, 0, id);
    q.index = cur;
    if (!q.shuffle) q.ordered = q.ids.slice();
    Store.save();
    App.queueChanged();
  },
  clearUpcoming() {
    const q = this.q;
    const cur = q.ids[q.index];
    if (!cur) { q.ids = []; q.ordered = []; q.index = -1; }
    else { q.ids = q.ids.slice(0, q.index + 1); q.ordered = q.ids.slice(); }
    Store.save();
    App.queueChanged();
  },
  toggleShuffle() {
    const q = this.q;
    q.shuffle = !q.shuffle;
    const cur = q.ids[q.index];
    if (q.shuffle) {
      const before = q.ids.slice(0, q.index + 1);
      q.ids = before.concat(shuffleInPlace(q.ids.slice(q.index + 1)));
    } else if (q.ordered.length) {
      q.ids = q.ordered.slice();
      q.index = Math.max(0, q.ids.indexOf(cur));
    }
    Store.save();
    Bar.modes();
    App.queueChanged();
    toast(q.shuffle ? '隨機播放：開啟' : '隨機播放：關閉');
  },
  cycleRepeat() {
    const q = this.q;
    q.repeat = q.repeat === 'off' ? 'all' : q.repeat === 'all' ? 'one' : 'off';
    Store.save();
    Bar.modes();
    toast({ off: '重複播放：關閉', all: '重複播放：整個佇列', one: '重複播放：單曲' }[q.repeat]);
  },
};

function playList(ids, start = 0, ctx = null, opts = {}) {
  ids = ids.filter(id => song(id));
  if (!ids.length) return;
  if (opts.shuffle) start = Math.floor(Math.random() * ids.length);
  if (Queue.set(ids, start, ctx, opts.shuffle)) { Bar.modes(); startCurrent(true); }
}

function playSingle(id) {
  const s = song(id);
  if (!s) return;
  playList([id], 0, { type: 'single', name: s.title });
}

function startCurrent(autoplay = true, at = 0) {
  const id = Queue.current();
  if (!id) return;
  Store.data.queue.pos = at;
  Player.load(id, at, autoplay);
  App.onTrackChange(id);
  Store.save();
}

function pushHistory(id) {
  const h = Store.data.history;
  if (h[0] && h[0].id === id && Date.now() - h[0].t < 90000) return;
  h.unshift({ id, t: Date.now() });
  if (h.length > 300) h.length = 300;
}

/* ---------- Sleep timer ---------- */

const Sleep = {
  until: 0,
  endOfTrack: false,
  set(min) {
    this.until = min ? Date.now() + min * 60000 : 0;
    this.endOfTrack = false;
    Bar.sleep();
    toast(min ? `${min} 分鐘後停止播放` : '睡眠定時器已關閉');
  },
  setEndOfTrack() {
    this.until = 0;
    this.endOfTrack = true;
    Bar.sleep();
    toast('這首播完後停止播放');
  },
  get active() { return !!(this.until || this.endOfTrack); },
  remaining() { return this.until ? Math.max(0, this.until - Date.now()) : 0; },
  tick() {
    if (this.until && Date.now() >= this.until) this.fire();
    else if (this.until) Bar.sleep();
  },
  fire() {
    this.until = 0;
    this.endOfTrack = false;
    Player.pause();
    Bar.sleep();
    toast('睡眠定時器時間到，已暫停播放');
  },
};

/* ---------- Player bar ---------- */

const Bar = {
  lastSec: -1,
  lastDur: -1,
  seeking: false,
  track(s) {

    if (!s) {

      $('#pbTrans').textContent = '';
      $('#pbArtist').textContent = '';
      $('#pbLike').hidden = true;
      document.title = APP.name;
      return;
    }
    art.hidden = false;
    art.src = thumb(s.id, 'mq');
    const t = $('#pbTitle');
    t.textContent = s.title;
    const lg = LANG_ATTR[songLang(s)];
    if (lg) t.setAttribute('lang', lg); else t.removeAttribute('lang');
    const tr = transOf(s);
    $('#pbTrans').textContent = tr;
    $('#pbTrans').hidden = !tr;
    $('#pbArtist').textContent = s.artist || '';
    $('#pbArtist').dataset.v = s.artist || '';
    const like = $('#pbLike');
    like.hidden = false;
    setLikeBtn(like, Lib.isLiked(s.id));
    this.title();
  },
  title() {
    const s = song(Player.id || Queue.current());
    document.title = s ? `${Player.isPlaying() ? '▶ ' : ''}${s.title} · ${s.artist}` : APP.name;
  },
  playState() {
    const p = Player.isPlaying();
    const b = $('#btnPlay');
    b.innerHTML = ic(p ? 'pause' : 'play');
    b.setAttribute('aria-label', p ? '暫停' : '播放');
    document.body.classList.toggle('paused', !p);
    this.title();
  },
  time(t, d) {
    const sec = Math.floor(t);
    if (sec !== this.lastSec || Math.floor(d) !== this.lastDur) {
      this.lastSec = sec;
      this.lastDur = Math.floor(d);
      if (!this.seeking) $('#tCur').textContent = fmtTime(t);
      $('#tDur').textContent = fmtTime(d);
    }
    if (!this.seeking) {
      const p = d > 0 ? clamp(t / d, 0, 1) : 0;
      const seek = $('#seek');
      seek.value = Math.round(p * 1000);
      seek.style.setProperty('--p', (p * 100).toFixed(2) + '%');
      $('#pbHairline').style.width = (p * 100).toFixed(2) + '%';
    }
  },
  modes() {
    const q = Store.data.queue;
    const sh = $('#btnShuffle');
    sh.classList.toggle('on', q.shuffle);
    sh.setAttribute('aria-pressed', q.shuffle ? 'true' : 'false');
    const rp = $('#btnRepeat');
    rp.classList.toggle('on', q.repeat !== 'off');
    rp.innerHTML = ic(q.repeat === 'one' ? 'repeat-one' : 'repeat');
    rp.setAttribute('aria-label', { off: '重複播放：關閉', all: '重複播放：整個佇列', one: '重複播放：單曲' }[q.repeat]);
  },
  volume() {
    const st = S();
    const v = st.muted ? 0 : st.volume;
    const vol = $('#vol');
    vol.value = v;
    vol.style.setProperty('--p', v + '%');
    const b = $('#btnMute');
    b.innerHTML = ic(v === 0 ? 'volume-x' : 'volume');
    b.setAttribute('aria-label', st.muted ? '取消靜音' : '靜音');
  },
  speed() {
    const r = Player.rate || 1;
    $('#speedLabel').textContent = (Math.round(r * 100) / 100) + '×';
    $('#btnSpeed').classList.toggle('on', r !== 1);
  },
  sleep() {
    const b = $('#sleepBadge');
    $('#btnSleep').classList.toggle('on', Sleep.active);
    if (Sleep.endOfTrack) { b.hidden = false; b.textContent = '曲'; }
    else if (Sleep.until) { b.hidden = false; b.textContent = Math.ceil(Sleep.remaining() / 60000) + '′'; }
    else b.hidden = true;
  },
};

function qRow(id, i, cur) {
  const s = song(id);
  if (!s) return '';
  const tr = transOf(s);
  return `<div class="qrow${cur ? ' cur' : ''}" data-row="${esc(id)}" data-qi="${i}" draggable="${cur ? 'false' : 'true'}">
    <span class="thumb">${img(id)}</span>
    <div class="tt"><div class="t1">${titleBits(s)}</div>${tr ? `<div class="t2"${tlAttr(S().tl)}>${esc(tr)}</div>` : ''}<div class="t3">${esc(s.artist)}</div></div>
    <div class="q-actions">${cur ? '' : `<button class="icon-btn sm" type="button" data-act="q-play" aria-label="播放">${ic('play')}</button><button class="icon-btn sm" type="button" data-act="q-remove" aria-label="從佇列移除">${ic('x')}</button>`}<button class="icon-btn sm" type="button" data-act="row-menu" aria-label="更多選項">${ic('more')}</button></div>
  </div>`;
}

function queueHTML() {
  const q = Store.data.queue;
  const cur = q.ids[q.index];
  if (!cur) return '<div class="empty sm">佇列是空的。播放任何歌曲或播放清單後，接下來的歌曲會出現在這裡。</div>';
  const up = q.ids.slice(q.index + 1);
  const left = up.reduce((a, id) => a + ((song(id) && song(id).duration) || 0), 0);
  return `${q.ctx && q.ctx.name ? `<div class="q-ctx">播放自 <b>${esc(q.ctx.name)}</b>${q.shuffle ? ' · 隨機' : ''}</div>` : ''}
    <div class="q-sec"><span>正在播放</span></div>${qRow(cur, q.index, true)}
    <div class="q-sec"><span>接下來</span><span>${up.length} 首${left ? ' · ' + fmtLong(left) : ''}</span></div>
    <div class="qlist" data-list="queue" data-reorder="1">${up.map((id, k) => qRow(id, q.index + 1 + k, false)).join('') || '<div class="empty sm">後面沒有歌曲了。在歌曲選單選「加入佇列」可以排更多歌。</div>'}</div>`;
}

const Drawer = {
  get open() { return !$('#drawer').hidden; },
  toggle(force) {
    const show = force !== undefined ? force : !this.open;
    $('#drawer').hidden = !show;
    $('#btnQueue').classList.toggle('on', show);
    if (show) { this.render(); const cur = $('#drawerBody .qrow.cur'); if (cur) cur.scrollIntoView({ block: 'nearest' }); }
  },
  render() { if (this.open) $('#drawerBody').innerHTML = queueHTML(); },
};

/* ---------- Song menu ---------- */

function playlistSubmenu(ids) {
  return [
    { label: '新增播放清單…', icon: 'plus', run: async () => {
      const name = await promptDialog({ title: '新增播放清單', label: '名稱', placeholder: '例如：通勤、歌回精選' });
      if (!name) return;
      const p = Lib.createPlaylist(name);
      const n = Lib.addToPlaylist(p.id, ids);
      Store.save();
      renderSidebar();
      toast(`已建立「${p.name}」並加入 ${n} 首`);
    } },
    Store.data.playlists.length ? { sep: true } : null,
    ...Store.data.playlists.map(p => ({ label: p.name, icon: 'playlist', hint: String(p.songs.length), run: () => addToPlaylist(p.id, ids) })),
  ];
}

function addToPlaylist(plId, ids) {
  const p = Lib.playlist(plId);
  if (!p) return;
  const n = Lib.addToPlaylist(plId, ids);
  Store.save();
  renderSidebar();
  if (Router.cur && Router.cur.name === 'playlist' && Router.cur.id === plId) rerender();
  toast(n ? `已加入「${p.name}」` : `「${p.name}」裡已經有這首歌`);
}

function openSongMenu(id, at, row) {
  const s = song(id);
  if (!s) return;
  const list = row && row.closest('[data-list]');
  const listKey = list ? list.dataset.list : '';
  const plId = listKey.startsWith('pl:') ? listKey.slice(3) : null;
  const inQueue = listKey === 'queue';
  const liked = Lib.isLiked(id);
  Menu.open([
    { header: s.title, lang: langAttr(songLang(s)) },
    { label: '播放', icon: 'play', run: () => (row && !inQueue ? Actions['row-play']({ id, row }) : row && inQueue ? Queue.playAt(+row.dataset.qi) : playSingle(id)) },
    { label: '下一首播放', icon: 'next', run: () => Queue.addNext([id]) },
    { label: '加入佇列', icon: 'queue', run: () => Queue.addEnd([id]) },
    inQueue && row && row.dataset.qi && +row.dataset.qi !== Store.data.queue.index ? { label: '從佇列移除', icon: 'minus-circle', run: () => Queue.removeAt(+row.dataset.qi) } : null,
    { sep: true },
    { label: '加入播放清單', icon: 'playlist-add', sub: () => playlistSubmenu([id]) },
    { label: liked ? '取消收藏' : '加入收藏', icon: liked ? 'heart-fill' : 'heart', run: () => toggleLike(id) },
    plId ? { label: '從這個播放清單移除', icon: 'minus-circle', run: () => removeFromPlaylist(plId, +row.dataset.i) } : null,
    { sep: true },
    { label: '編輯歌曲資訊', icon: 'edit', run: () => openEditSong(id) },
    { label: '搜尋歌詞', icon: 'mic', run: () => openLyricSearch(id) },
    { label: '重新翻譯歌名', icon: 'translate', run: () => { TransQ.push(id, true); toast('正在重新翻譯'); } },
    { sep: true },
    { label: '複製 YouTube 連結', icon: 'link', run: () => copyText(ytWatch(id), '已複製連結') },
    { label: '在 YouTube 開啟', icon: 'external', run: () => window.open(ytWatch(id), '_blank', 'noopener') },
    Lib.inLib(id) ? { sep: true } : null,
    Lib.inLib(id)
      ? { label: '從音樂庫移除', icon: 'trash', danger: true, run: () => removeFromLibrary(id) }
      : { label: '加入音樂庫', icon: 'plus', run: () => { Lib.addMany([id]); Store.save(); renderSidebar(); rerender(); toast('已加入音樂庫'); } },
  ], at);
}

function removeFromPlaylist(plId, index) {
  const p = Lib.playlist(plId);
  if (!p || index < 0 || index >= p.songs.length) return;
  const [id] = p.songs.splice(index, 1);
  p.updated = Date.now();
  Store.save();
  renderSidebar();
  rerender();
  toast('已從播放清單移除', { action: { label: '復原', run: () => { p.songs.splice(index, 0, id); Store.save(); renderSidebar(); rerender(); } } });
}

async function removeFromLibrary(id) {
  const s = song(id);
  if (!s) return;
  const inPls = Store.data.playlists.filter(p => p.songs.includes(id)).length;
  const ok = await confirmDialog({
    title: '從音樂庫移除？',
    body: `「${esc(s.title)}」會從歌曲、收藏${inPls ? `和 ${inPls} 個播放清單` : ''}中移除。已存的歌詞會保留。`,
    ok: '移除', danger: true,
  });
  if (!ok) return;
  Lib.remove(id);
  Store.save();
  renderSidebar();
  rerender();
  toast('已從音樂庫移除');
}

/* ---------- Video dock: one persistent iframe, positioned over the visible slot ---------- */

let dockKey = '';
function syncDock() {
  const dock = $('#videoDock');
  let slot = null;
  if (NP.isOpen) slot = $('#npVideoSlot');
  else if (S().showVideo && Player.id) {
    const mv = $('#miniVideo');
    if (mv && !mv.hidden && mv.offsetParent !== null) slot = $('#miniVideoSlot');
  }
  let key = 'off';
  if (slot) {
    const r = slot.getBoundingClientRect();
    if (r.width > 2 && r.height > 2) key = `${Math.round(r.left)},${Math.round(r.top)},${Math.round(r.width)},${Math.round(r.height)}`;
  }
  if (key === dockKey) return;
  dockKey = key;
  if (key === 'off') {
    dock.style.transform = 'translate(-10000px, 0)';
    dock.style.width = '320px';
    dock.style.height = '180px';
    return;
  }
  const [x, y, w, h] = key.split(',').map(Number);
  dock.style.transform = `translate(${x}px, ${y}px)`;
  dock.style.width = w + 'px';
  dock.style.height = h + 'px';
}

/* =====================================================================
   Routing and page views.
   Routes: #home #search #songs #likes #playlists #recent #pl-<id> #np
   ===================================================================== */

const Router = {
  cur: null,
  parse() {
    let h = location.hash.replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* keep the raw hash */ }
    h = h || 'home';
    if (h === 'np') return { name: 'np' };
    if (h.startsWith('pl-')) return { name: 'playlist', id: h.slice(3) };
    if (h.startsWith('artist-')) return { name: 'artist', id: h.slice(7) };
    if (['home', 'search', 'songs', 'likes', 'playlists', 'artists', 'recent'].includes(h)) return { name: h };
    return { name: 'home' };
  },
  go(hash) {
    if (location.hash === '#' + hash) onRoute();
    else location.hash = hash;
  },
};

function onRoute() {
  const r = Router.parse();
  Menu.close();
  if (r.name === 'np') {
    if (!Router.cur) renderView({ name: 'home' });
    NP.show();
    return;
  }
  const wasNp = NP.isOpen;
  if (wasNp) NP.hide();
  const same = Router.cur && Router.cur.name === r.name && Router.cur.id === r.id;
  if (same && wasNp) return;
  renderView(r, same);
  if (!same && isMobile()) Drawer.toggle(false);
}

function renderView(r, keepScroll = false) {
  const main = $('#main');
  const top = keepScroll ? main.scrollTop : 0;
  Router.cur = r;
  View.lists = {};
  let html;
  switch (r.name) {
    case 'search': html = Views.search(); break;
    case 'songs': html = Views.songs(); break;
    case 'likes': html = Views.likes(); break;
    case 'playlists': html = Views.playlists(); break;
    case 'recent': html = Views.recent(); break;
    case 'playlist': html = Views.playlist(r.id); break;
    case 'artists': html = Views.artists(); break;
    case 'artist': html = Views.artist(r.id); break;
    default: html = Views.home();
  }
  $('#view').innerHTML = html;
  main.scrollTop = top;
  markNav();
  if (r.name === 'search' && !keepScroll && !coarse()) {
    const q = $('#q');
    if (document.activeElement !== q) q.focus({ preventScroll: true });
  }
}

const rerender = debounce(() => { if (Router.cur) renderView(Router.cur, true); }, 120);

function section(title, link, body) {
  return `<section class="section"><div class="section-head"><h2>${esc(title)}</h2>${link ? `<a href="${link.href}">${esc(link.label)}</a>` : ''}</div>${body}</section>`;
}

function artistGroups() {
  const groups = new Map();
  for (const id of Store.data.order) {
    const s = song(id);
    const n = s && (s.artist || '').trim();
    if (!n) continue;
    if (!groups.has(n)) groups.set(n, []);
    groups.get(n).push(id);
  }
  return groups;
}

  artist(name) {
    const ids = artistGroups().get(name) || [];
    if (!ids.length) return `<div class="empty"><h3>音樂庫裡沒有「${esc(name)}」的歌</h3><p>可能已經改名或移除。</p><a class="btn" href="#artists">回到演唱者</a></div>`;
    const key = 'artist:' + name;
    return listHeader({
      kicker: '演唱者', title: name, sub: totalOf(ids), art: `<div class="mosaic one">${img(ids[0], 'hq')}</div>`, bg: ids[0], round: true,
      actions: playButtons(key),
    }) + trackList(ids, key, { ctx: { type: 'artist', name } });
  },

  playlist(id) {
    const p = Lib.playlist(id);
    if (!p) return '<div class="empty"><h3>找不到這個播放清單</h3><p>它可能已經被刪除。</p><a class="btn" href="#playlists">回到播放清單</a></div>';
    const key = 'pl:' + p.id;
    return listHeader({
      kicker: '播放清單', title: p.name, desc: p.desc, sub: `${totalOf(p.songs)} · 更新於 ${relTime(p.updated || p.created)}`,
      art: mosaic(p.songs), bg: p.songs[0],
      actions: (p.songs.length ? playButtons(key) : '') +
        `<button class="btn btn-ghost" type="button" data-act="add" data-pl="${esc(p.id)}">${ic('plus')}加入歌曲</button>
         <button class="icon-btn round" type="button" data-act="pl-menu" data-pl="${esc(p.id)}" aria-label="播放清單選項">${ic('more')}</button>`,
    }) + trackList(p.songs, key, {
      ctx: { type: 'playlist', id: p.id, name: p.name }, reorder: true,
      empty: `<div class="empty"><h3>這個清單還是空的</h3><p>從歌曲列表把歌拖到左側的清單名稱上，或貼上 YouTube 連結加入。</p><button class="btn btn-light" type="button" data-act="add" data-pl="${esc(p.id)}">${ic('plus')}加入歌曲</button></div>`,
    });
  },

  search() {
    const q = Search.q.trim();
    let html = `<div class="page-pad"><p class="kicker">搜尋</p><h1 class="page-title">${q ? `「${esc(q)}」` : '找一首歌'}</h1></div>`;
    if (!q) {
      return html + `<section class="section"><p class="help" style="font-size:14px;max-width:60ch">在上方輸入歌名、譯名、歌手或頻道名稱，會即時搜尋你的音樂庫。貼上 YouTube 連結可以直接加入。${S().apiKey ? '按 Enter 會同時搜尋 YouTube。' : '在設定加入 YouTube API 金鑰後，也能直接搜尋 YouTube。'}</p></section>`;
    }
    const yt = parseYouTubeInput(q);
    if (yt.videos.length || yt.lists.length) {
      html += section('偵測到 YouTube 連結', null, `<div class="phead-actions" style="margin-top:0">
        <span class="detect"><span class="pill">${yt.videos.length} 部影片</span>${yt.lists.length ? `<span class="pill">${yt.lists.length} 個播放清單</span>` : ''}</span>
        <button class="btn btn-light" type="button" data-act="add-from-search">${ic('plus')}加入音樂庫</button>
      </div>`);
    }
    const nq = norm(q);
    const hits = Store.data.order.filter(id => {
      const s = song(id);
      return s && [s.title, s.trans, s.artist, s.origArtist, s.album, s.channel, s.rawTitle].some(x => x && norm(x).includes(nq));
    });
    const pls = Store.data.playlists.filter(p => norm(p.name).includes(nq) || norm(p.desc).includes(nq));
    const artists = [...artistGroups().keys()].filter(n => norm(n).includes(nq)).slice(0, 12);
    if (artists.length) html += section('演唱者', null, `<div class="detect">${artists.map(n => `<a class="pill" href="#artist-${encodeURIComponent(n)}"${langAttr(detectScript(n))}>${ic('mic')}${esc(n)}</a>`).join('')}</div>`);
    if (pls.length) html += section('播放清單', null, `<div class="cards">${pls.map(playlistCard).join('')}</div>`);
    html += section(`音樂庫中的歌曲${hits.length ? `（${hits.length}）` : ''}`, null,
      trackList(hits, 'search', { ctx: { type: 'search', name: `搜尋「${q}」` }, empty: '<p class="help">音樂庫裡沒有符合的歌曲。</p>' }));

    if (!(yt.videos.length || yt.lists.length)) {
      let ytBody;
      if (!S().apiKey) {
        ytBody = `<p class="help">直接搜尋 YouTube 需要 YouTube Data API 金鑰（可在設定填入）。也可以 <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">在 YouTube 搜尋「${esc(q)}」</a>，複製連結後回來貼上。</p>`;
      } else if (Search.ytLoading) {
        ytBody = '<div class="spinner" role="status" aria-label="搜尋中"></div>';
      } else if (Search.ytError && Search.ytQ === q) {
        ytBody = `<p class="help">YouTube 搜尋失敗：${esc(Search.ytError)}</p>`;
      } else if (Search.ytResults && Search.ytQ === q) {
        ytBody = Search.ytResults.length ? `<div class="tlist">${Search.ytResults.map(ytRow).join('')}</div>` : '<p class="help">YouTube 沒有找到可嵌入播放的結果。</p>';
      } else {
        ytBody = `<button class="btn" type="button" data-act="search-yt">${ic('search')}搜尋 YouTube</button> <span class="help">（或按 Enter）</span>`;
      }
      html += section('YouTube', null, ytBody);
    }
    return html;
  },
};

function ytRow(r, i) {
  const p = parseVideoTitle(r.rawTitle, r.channel);
  const have = Lib.inLib(r.id);
  return `<div class="trow" data-yt="${esc(r.id)}" data-i="${i}">
    <div class="c-idx"><span class="n">${i + 1}</span></div>
    <div class="c-title"><span class="thumb">${img(r.id)}</span><div class="tt">
      <div class="t1"><span class="tx"${langAttr(detectScript(p.title))}>${esc(p.title)}</span></div>
      <div class="t2">${esc(r.rawTitle)}</div>
      <div class="t3 m-only">${esc(r.channel)}</div>
    </div></div>
    <div class="c-artist">${esc(p.artist)}</div>
    <div class="c-src">${esc(r.channel)}</div>
    <div class="c-extra"></div>
    <div class="c-like"><button class="icon-btn" type="button" data-act="yt-play" data-yt="${esc(r.id)}" aria-label="播放" style="opacity:1">${ic('play')}</button></div>
    <div class="c-dur">${r.duration ? fmtTime(r.duration) : '–'}</div>
    <div class="c-more"><button class="icon-btn${have ? ' on' : ''}" type="button" data-act="yt-add" data-yt="${esc(r.id)}" aria-label="${have ? '已在音樂庫' : '加入音樂庫'}" style="opacity:1">${ic(have ? 'check' : 'plus')}</button></div>
  </div>`;
}

async function runYouTubeSearch() {
  const q = Search.q.trim();
  if (!q || !S().apiKey) return;
  Search.ytQ = q;
  Search.ytLoading = true;
  Search.ytError = '';
  Search.ytResults = null;
  rerender();
  try {
    Search.ytResults = await YTData.search(q);
  } catch (e) {
    Search.ytError = e.message || String(e);
  }
  Search.ytLoading = false;
  if (Search.q.trim() === q) rerender();
}

   Now playing overlay, synced lyrics, floating lyrics window,

const NP = {
  isOpen: false,
  tab: 'lyrics',
  fromApp: false,
  open(tab) {
    if (tab) this.tab = tab;
    if (location.hash !== '#np') { this.fromApp = true; location.hash = 'np'; }
    else this.show();
  },
  show() {
    const first = !this.isOpen;
    this.isOpen = true;
    $('#np').hidden = false;
    document.body.classList.add('np-open');
    Drawer.toggle(false);
    this.setTab(this.tab);
    this.render();
    updateBottomVars();
    if (first) requestAnimationFrame(() => { Lyrics.sync(false); });
  },
  hide() {
    if (!this.isOpen) return;
    this.isOpen = false;
    this.fromApp = false;
    $('#np').hidden = true;
    document.body.classList.remove('np-open');
    $('#btnLyrics').classList.remove('on');
    updateBottomVars();
  },
  close() {
    if (!this.isOpen) return;
    if (this.fromApp) history.back();
    else location.hash = routeKey(Router.cur);
  },
  toggle(tab) {
    if (!this.isOpen) this.open(tab);
    else if (tab && tab !== this.tab) this.setTab(tab);
    else this.close();
  },
  setTab(tab) {
    this.tab = tab;
    $$('.np-tabs [role="tab"]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'));
    $('#npPanelLyrics').hidden = tab !== 'lyrics';
    $('#npPanelQueue').hidden = tab !== 'queue';
    $('#npPanelInfo').hidden = tab !== 'info';
    $('#btnLyrics').classList.toggle('on', this.isOpen && tab === 'lyrics');
    if (tab === 'queue') this.renderQueue();
    if (tab === 'info') this.renderInfo();
    if (tab === 'lyrics') requestAnimationFrame(() => Lyrics.sync(false));
  },
  render() {
    const s = song(Queue.current());
    const ctx = Store.data.queue.ctx;
    $('#npContext').innerHTML = ctx && ctx.name ? `播放自 <b>${esc(ctx.name)}</b>` : '正在播放';
    if (!s) {
      $('#npTitle').textContent = '還沒有播放歌曲';
      $('#npTrans').textContent = '';
      $('#npArtist').textContent = '';
      $('#npCover').removeAttribute('src');
      $('#npBg').removeAttribute('src');
      $('#npLike').hidden = true;
      return;
    }
    $('#npCover').src = thumb(s.id, 'hq');
    $('#npBg').src = thumb(s.id, 'hq');
    const t = $('#npTitle');
    t.textContent = s.title;
    const lg = LANG_ATTR[songLang(s)];
    if (lg) t.setAttribute('lang', lg); else t.removeAttribute('lang');
    const tr = transOf(s);
    $('#npTrans').textContent = tr;
    $('#npTrans').hidden = !tr;
    $('#npArtist').textContent = s.artist || '';
    $('#npArtist').dataset.v = s.artist || '';
    $('#npLike').hidden = false;
    setLikeBtn($('#npLike'), Lib.isLiked(s.id));
    this.renderInfo();
  },
  renderQueue() { if (this.isOpen && this.tab === 'queue') $('#npPanelQueue').innerHTML = queueHTML(); },
  renderInfo() {
    if (!(this.isOpen && this.tab === 'info')) return;
    const s = song(Queue.current());
    if (!s) { $('#npPanelInfo').innerHTML = '<div class="empty sm">還沒有播放歌曲。</div>'; return; }
    const rec = Lyrics.id === s.id ? Lyrics.rec : null;
    const src = !rec ? '讀取中' : rec.source === 'lrclib' ? `LRCLIB #${rec.lrclibId}` : rec.source === 'tap' ? '自己打點製作' : rec.source === 'manual' ? '手動貼上' : '沒有歌詞';
    const row = (k, v, mono) => (v ? `<dt>${k}</dt><dd${mono ? ' class="mono"' : ''}>${v}</dd>` : '');
    $('#npPanelInfo').innerHTML = `<dl class="info-grid">
      ${row('YouTube 標題', esc(s.rawTitle || '—'))}
      ${row('頻道', esc(s.channel))}
      ${row('演唱者', esc(s.artist))}
      ${row('原唱', esc(s.origArtist))}
      ${row('歌名翻譯', s.trans ? esc(s.trans) : '')}
      ${row('專輯 / 備註', esc(s.album))}
      ${row('長度', s.duration ? fmtTime(s.duration) : '')}
      ${row('加入時間', s.added ? new Date(s.added).toLocaleDateString('zh-TW') : '')}
      ${row('播放次數', String(s.plays || 0))}
      ${row('歌詞來源', esc(src) + (rec && rec.track ? `<br><span class="help">${esc(rec.track)} — ${esc(rec.artist)}</span>` : ''))}
      ${row('歌詞偏移', fmtOffset(s.offset))}
      ${row('影片 ID', esc(s.id), true)}
    </dl>
    <div class="info-actions">
      <button class="btn" type="button" data-act="edit-current">${ic('edit')}編輯資訊</button>
      <button class="btn" type="button" data-act="ly-search">${ic('mic')}搜尋歌詞</button>
      <a class="btn btn-ghost" href="${ytWatch(s.id)}" target="_blank" rel="noopener">${ic('external')}在 YouTube 開啟</a>
    </div>`;
  },
};

/* ---------- Synced lyrics ---------- */

function lyFlag(rec) {
  if (!rec) return '';
  if (rec.kind === 'synced') return 'synced';
  if (rec.kind === 'plain') return 'plain';
  if (rec.kind === 'instrumental') return 'inst';
  return 'none';
}

async function waitForDuration(id, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms && Player.id === id) {
    const d = Player.ready && Player.yt && Player.yt.getDuration ? Player.yt.getDuration() : 0;
    if (d > 0) return d;
    await sleep(250);
  }
  return (song(id) && song(id).duration) || 0;
}

const Lyrics = {
  id: null,
  rec: null,
  parsed: null,
  status: 'idle', // idle | loading | searching | ready | none | instrumental | error
  err: '',
  idx: -2,
  token: 0,
  userScrollUntil: 0,
  calibrating: false,
  trans: null,
  transBusy: false,

  async load(id, opts = {}) {
    const tok = ++this.token;
    Object.assign(this, { id, rec: null, parsed: null, idx: -2, calibrating: false, trans: null, err: '' });
    if (!id) { this.status = 'idle'; this.render(); return; }
    this.status = 'loading';
    this.render();
    let rec = await KV.get('lyr:' + id);
    if (tok !== this.token) return;
    const stale = rec && rec.kind === 'none' && !rec.manual && Date.now() - (rec.at || 0) > 7 * 864e5;
    if (rec && !opts.refetch && !stale) { this.apply(rec); return; }
    if (!S().autoLyrics && !opts.refetch) { this.status = 'none'; this.render(); return; }
    this.status = 'searching';
    this.render();
    const dur = await waitForDuration(id, 5000);
    if (tok !== this.token) return;
    try {
      const best = await findLyrics(song(id), dur);
      if (tok !== this.token) return;
      rec = best ? recFromLrclib(best) : { kind: 'none', at: Date.now() };
      await KV.set('lyr:' + id, rec);
      if (tok !== this.token) return;
      this.apply(rec);
    } catch (e) {
      if (tok !== this.token) return;
      this.status = 'error';
      this.err = e.name === 'AbortError' ? '連線逾時' : e.message || String(e);
      this.render();
    }
  },
  apply(rec) {
    this.rec = rec;
    this.trans = null;
    if (rec.kind === 'synced' || rec.kind === 'plain') {
      this.parsed = parseLRC(rec.kind === 'synced' ? rec.lrc : rec.plain);
      this.status = this.parsed.lines.length ? 'ready' : 'none';
    } else {
      this.parsed = null;
      this.status = rec.kind === 'instrumental' ? 'instrumental' : 'none';
    }
    const s = song(this.id);
    if (s) {
      const flag = this.status === 'ready' ? (this.parsed.synced ? 'synced' : 'plain') : lyFlag(rec);
      if (s.ly !== flag) { s.ly = flag; Store.save(); App.songChanged(this.id, true); }
    }
    if (this.status === 'ready' && rec.trans && rec.trans.tl === S().tl && rec.trans.n === this.parsed.lines.length) this.trans = rec.trans.lines;
    this.render();
    if (S().lyricTrans) this.ensureTrans();
    NP.renderInfo();
  },
  async save(id, rec) {
    await KV.set('lyr:' + id, rec);
    if (id === this.id) { this.token++; this.apply(rec); }
    else {
      const s = song(id);
      if (s) { s.ly = lyFlag(rec); Store.save(); App.songChanged(id, true); }
    }
  },
  lyricLang() {
    if (this.status !== 'ready') return '';
    const sample = this.parsed.lines.slice(0, 12).map(l => l.text).join(' ');
    const d = detectScript(sample);
    if (d === 'zh' && songLang(song(this.id)) === 'ja') return 'ja';
    return d;
  },
  toolbarHTML() {
    const s = song(this.id);
    if (!s) return '';
    const ready = this.status === 'ready';
    const synced = ready && this.parsed.synced;
    const srcName = { lrclib: 'LRCLIB', tap: '打點製作', manual: '手動匯入' }[this.rec && this.rec.source] || '';
    return `${ready ? `<span class="ly-src">${synced ? '<b>LRC</b>' : ''}<span class="ly-src-t">${synced ? '同步歌詞' : '純文字歌詞'}${srcName ? ' · ' + srcName : ''}</span></span>` : ''}
      ${synced ? `<span class="ly-offset" title="歌詞時間偏移（鍵盤 [ 與 ] 也能調整）">
          <button type="button" data-act="ly-off" data-d="-0.1" aria-label="歌詞延後 0.1 秒">${ic('minus')}</button>
          <button type="button" class="val" data-act="ly-off-reset" aria-label="偏移歸零">${fmtOffset(s.offset)}</button>
          <button type="button" data-act="ly-off" data-d="0.1" aria-label="歌詞提早 0.1 秒">${ic('plus')}</button>
        </span>
        <button class="chip${this.calibrating ? ' on' : ''}" type="button" data-act="ly-calib" title="在歌手唱某一句時點那一句，自動對齊時間">${ic('target')}校正</button>` : ''}
      <span class="grow"></span>
      ${ready ? `<button class="chip${S().lyricTrans ? ' on' : ''}" type="button" data-act="ly-trans" aria-pressed="${S().lyricTrans}">${ic('translate')}翻譯${this.transBusy ? '中…' : ''}</button>` : ''}
      <button class="icon-btn sm" type="button" data-act="ly-size" data-d="-1" aria-label="縮小歌詞">${ic('text-small')}</button>
      <button class="icon-btn sm" type="button" data-act="ly-size" data-d="1" aria-label="放大歌詞">${ic('text-large')}</button>
      ${PiP.supported() ? `<button class="icon-btn sm" type="button" data-act="ly-pip" aria-label="子母畫面歌詞" title="子母畫面歌詞（視窗永遠在最上層）">${ic('pip')}</button>` : ''}
      <button class="icon-btn sm" type="button" data-act="ly-menu" aria-label="更多歌詞選項">${ic('more')}</button>`;
  },
  linesHTML() {
    const st = this.status;
    if (st === 'idle') return '<div class="ly-state"><p class="big">歌詞會顯示在這裡</p><p>選一首歌開始播放。</p></div>';
    if (st === 'loading' || st === 'searching') {
      return `<div class="ly-state"><div class="spinner" role="status" aria-label="載入中"></div><p>${st === 'searching' ? '正在 LRCLIB 比對歌詞…' : '載入歌詞…'}</p></div>`;
    }
    const actions = `<div class="row-btns"><button class="btn btn-light" type="button" data-act="ly-search">${ic('search')}搜尋歌詞</button><button class="btn" type="button" data-act="ly-edit-text">${ic('edit')}貼上歌詞</button></div>`;
    if (st === 'error') return `<div class="ly-state"><p class="big">連不上歌詞資料庫</p><p>${esc(this.err)}</p><div class="row-btns"><button class="btn btn-light" type="button" data-act="ly-retry">${ic('refresh')}重試</button><button class="btn" type="button" data-act="ly-edit-text">${ic('edit')}貼上歌詞</button></div></div>`;
    if (st === 'instrumental') return `<div class="ly-state"><p class="big">純音樂</p><p>LRCLIB 把這首標記為沒有歌詞的演奏曲。如果其實有歌詞，可以重新搜尋。</p>${actions}</div>`;
    if (st === 'none') return `<div class="ly-state"><p class="big">還沒有歌詞</p><p>自動比對沒有找到。換個關鍵字搜尋（翻唱可以改填原曲歌名），或貼上歌詞自己打點同步。</p>${actions}</div>`;
    const P = this.parsed;
    const tr = S().lyricTrans ? this.trans : null;
    const trHTML = i => (tr && tr[i] ? `<span class="ly-tr"${tlAttr(S().tl)}>${esc(tr[i])}</span>` : '');
    if (!P.synced) {
      return `<div class="ly-plain-note">${ic('clock')}<span>這份歌詞沒有時間軸。</span><button class="link" type="button" data-act="ly-tap" style="color:var(--accent)">打點同步</button></div>` +
        P.lines.map((l, i) => `<div class="ly-line">${esc(l.text)}${trHTML(i)}</div>`).join('');
    }
    let html = '';
    if (P.lines.length && P.lines[0].t > 3) html += '<div class="ly-line ly-gap" data-i="-1"><span class="dots"><i></i><i></i><i></i></span></div>';
    html += P.lines.map((l, i) => {
      if (!l.text) return `<div class="ly-line ly-gap" data-i="${i}"><span class="dots"><i></i><i></i><i></i></span></div>`;
      const body = l.words ? l.words.map(w => `<span class="w">${esc(w.text)}</span>`).join('') : esc(l.text);
      return `<div class="ly-line" data-i="${i}">${body}${trHTML(i)}</div>`;
    }).join('');
    return html;
  },
  render() {
    $('#lyToolbar').innerHTML = this.toolbarHTML();
    const box = $('#lyLines');
    box.className = 'ly-lines' + (this.status === 'ready' && !this.parsed.synced ? ' plain' : '');
    box.innerHTML = this.linesHTML();
    const lg = LANG_ATTR[this.lyricLang()];
    if (lg) box.setAttribute('lang', lg); else box.removeAttribute('lang');
    box.style.setProperty('--ly-scale', S().lyricScale || 1);
    $('#npPanelLyrics').classList.toggle('calibrating', this.calibrating);
    const hint = $('#lyHint');
    hint.hidden = !this.calibrating;
    hint.innerHTML = this.calibrating ? `${ic('target')}<span class="grow">在歌手唱到某一句的瞬間點那一句，整份歌詞會對齊到那個時間點。</span><button class="btn sm btn-ghost" type="button" data-act="ly-calib">取消</button>` : '';
    $('#lyResume').hidden = true;
    this.userScrollUntil = 0;
    this.idx = -2;
    this.sync(false);
    PiP.dirty = true;
  },
  /* Re-highlight immediately (used after render and when the view becomes visible) */
  sync(smooth) {
    if (this.status !== 'ready' || !this.parsed.synced) return;
    this.idx = this.indexAt(Player.time());
    this.highlight(smooth);
  },
  indexAt(t) {
    const s = song(this.id);
    return lineIndexAt(this.parsed.lines, t + ((s && s.offset) || 0) + 0.12);
  },
  tick(t) {
    if (this.status !== 'ready' || !this.parsed.synced) return;
    const lines = this.parsed.lines;
    const i = this.indexAt(t);
    if (i !== this.idx) { this.idx = i; this.highlight(true); }
    if (i >= 0 && lines[i].words) {
      const el = this.lineEl(i);
      if (el) {
        const s = song(this.id);
        const te = t + ((s && s.offset) || 0) + 0.12;
        const ws = el.querySelectorAll('.w');
        lines[i].words.forEach((w, k) => { if (ws[k]) ws[k].classList.toggle('sung', w.t <= te); });
      }
    }
  },
  lineEl(i) { return $(`#lyLines .ly-line[data-i="${i}"]`); },
  highlight(smooth) {
    const i = this.idx;
    $$('#lyLines .ly-line[data-i]').forEach(el => {
      const k = +el.dataset.i;
      el.classList.toggle('on', k === i);
      el.classList.toggle('past', k < i);
    });
    if (Date.now() > this.userScrollUntil) this.scrollTo(i, smooth);
    PiP.dirty = true;
    const rl = $('#resumeLine');
    if (rl) rl.textContent = this.currentText();
  },
  scrollTo(i, smooth = true) {
    const box = $('#lyScroll');
    if (!box || box.offsetParent === null) return;
    const el = this.lineEl(i) || $('#lyLines .ly-line');
    if (!el) return;
    const top = el.offsetTop - box.clientHeight * 0.32 + el.offsetHeight / 2;
    box.scrollTo({ top: Math.max(0, top), behavior: smooth && !reducedMotion() ? 'smooth' : 'auto' });
  },
  userScrolled() {
    if (this.status !== 'ready' || !this.parsed.synced) return;
    this.userScrollUntil = Date.now() + 5000;
    $('#lyResume').hidden = false;
    clearTimeout(this.resumeTimer);
    this.resumeTimer = setTimeout(() => { $('#lyResume').hidden = true; }, 5000);
  },
  resume() {
    this.userScrollUntil = 0;
    $('#lyResume').hidden = true;
    this.scrollTo(this.idx, true);
  },
  currentText() {
    if (this.status !== 'ready' || !this.parsed.synced) return '';
    const l = this.parsed.lines[this.idx];
    return l ? l.text : '';
  },
  nextText() {
    if (this.status !== 'ready' || !this.parsed.synced) return '';
    for (let k = this.idx + 1; k < this.parsed.lines.length; k++) if (this.parsed.lines[k].text) return this.parsed.lines[k].text;
    return '';
  },
  clickLine(el) {
    if (this.status !== 'ready' || !this.parsed.synced || !el.dataset.i) return;
    const i = +el.dataset.i;
    const lt = i >= 0 ? this.parsed.lines[i].t : 0;
    const s = song(this.id);
    if (!s) return;
    if (this.calibrating) {
      s.offset = round1(lt - Player.time() + 0.15);
      Store.save();
      this.calibrating = false;
      this.render();
      toast(`已對齊：歌詞${fmtOffset(s.offset)}`);
      return;
    }
    Player.seek(Math.max(0, lt - (s.offset || 0) - 0.05));
    if (!Player.isPlaying()) Player.play();
    this.userScrollUntil = 0;
  },
  adjustOffset(d) {
    const s = song(this.id);
    if (!s) return;
    s.offset = round1((s.offset || 0) + d);
    Store.save();
    const v = $('#lyToolbar .ly-offset .val');
    if (v) v.textContent = fmtOffset(s.offset);
    if (!NP.isOpen) toast(`歌詞偏移 ${fmtOffset(s.offset)}`);
    this.sync(true);
  },
  resetOffset() {
    const s = song(this.id);
    if (!s) return;
    s.offset = 0;
    Store.save();
    this.render();
  },
  async ensureTrans() {
    if (!S().lyricTrans || this.status !== 'ready') return;
    const tl = S().tl;
    const rec = this.rec;
    const lines = this.parsed.lines;
    if (rec.trans && rec.trans.tl === tl && rec.trans.n === lines.length) { this.trans = rec.trans.lines; return; }
    if (this.transBusy) return;
    this.transBusy = true;
    const tok = this.token, id = this.id;
    this.render();
    try {
      const out = await translateLines(lines.map(l => l.text), tl);
      rec.trans = { tl, n: lines.length, lines: out };
      await KV.set('lyr:' + id, rec);
      if (tok !== this.token) return;
      this.trans = out;
    } catch (e) {
      if (tok === this.token) toast('歌詞翻譯失敗：翻譯服務暫時無法連線');
    } finally {
      this.transBusy = false;
      if (tok === this.token) this.render();
    }
  },
  menu(anchor) {
    const s = song(this.id);
    if (!s) return;
    const has = this.status === 'ready';
    Menu.open([
      { label: '搜尋其他歌詞', icon: 'search', run: () => openLyricSearch(s.id) },
      { label: '打點同步', icon: 'target', run: () => openLyricEditor(s.id, 'tap') },
      { label: '編輯文字 / 貼上 LRC', icon: 'edit', run: () => openLyricEditor(s.id, 'text') },
      { label: '重新自動比對', icon: 'refresh', run: () => this.load(s.id, { refetch: true }) },
      { sep: true },
      has ? { label: '複製歌詞', icon: 'copy', run: () => copyText(this.parsed.lines.map(l => l.text).join('\n'), '已複製歌詞') } : null,
      has && this.parsed.synced ? { label: '下載 .lrc 檔', icon: 'download', run: () => downloadLrc(s, this.parsed.lines) } : null,
      has ? { label: '清除這首的歌詞', icon: 'trash', danger: true, run: async () => {
        if (!(await confirmDialog({ title: '清除歌詞？', body: '這首歌目前的歌詞與時間軸會被刪除，不會再自動比對。', ok: '清除', danger: true }))) return;
        await this.save(s.id, { kind: 'none', manual: true, at: Date.now() });
        toast('已清除歌詞');
      } } : null,
    ], anchor);
  },
};

function downloadLrc(s, lines) {
  const lrc = serializeLRC(lines, { ti: s.title, ar: s.artist, by: APP.name });
  const safe = `${s.title} - ${s.artist}`.replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 120) || s.id;
  downloadFile(safe + '.lrc', lrc);
}

const PiP = {
  win: null,
  dirty: true,
  lastPlay: null,
  supported() { return 'documentPictureInPicture' in window; },
  async open() {
    if (!this.supported()) { toast('這個瀏覽器不支援子母畫面歌詞，請改用桌面版 Chrome 或 Edge'); return; }
    if (this.win) { this.win.focus(); return; }
    try {
      this.win = await window.documentPictureInPicture.requestWindow({ width: 540, height: 200 });
    } catch (e) { toast('無法開啟子母畫面：' + (e.message || e)); return; }
    const w = this.win, d = w.document;
    const font = $('#fontCss');
    if (font) { const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = font.href; d.head.appendChild(l); }
    const st = d.createElement('style');
    st.textContent = PIP_CSS;
    d.head.appendChild(st);
    d.title = '歌詞';
    d.body.innerHTML = `<div class="pip"><div class="pip-cur" id="c"></div><div class="pip-tr" id="tr"></div><div class="pip-next" id="n"></div>
      <div class="pip-foot"><span class="ti" id="ti"></span><button id="pv" type="button" aria-label="上一首">${PIP_SVG.prev}</button><button id="pp" type="button" aria-label="播放或暫停"></button><button id="nx" type="button" aria-label="下一首">${PIP_SVG.next}</button></div></div>`;
    d.getElementById('pv').addEventListener('click', () => Queue.prev());
    d.getElementById('pp').addEventListener('click', () => Player.toggle());
    d.getElementById('nx').addEventListener('click', () => Queue.next());
    w.addEventListener('pagehide', () => { this.win = null; });
    this.dirty = true;
    this.lastPlay = null;
    const loop = () => {
      if (!this.win) return;
      Lyrics.tick(Player.time());
      this.update();
      w.requestAnimationFrame(loop);
    };
    w.requestAnimationFrame(loop);
  },
  update() {
    if (!this.win) return;
    const d = this.win.document;
    const p = Player.isPlaying();
    if (p !== this.lastPlay) { this.lastPlay = p; d.getElementById('pp').innerHTML = p ? PIP_SVG.pause : PIP_SVG.play; }
    if (!this.dirty) return;
    this.dirty = false;
    const s = song(Lyrics.id);
    const L = Lyrics;
    let cur = '', next = '', tr = '';
    if (L.status === 'ready' && L.parsed.synced) {
      cur = L.currentText() || (L.idx < 0 ? '♪' : '…');
      next = L.nextText();
      tr = S().lyricTrans && L.trans && L.trans[L.idx] ? L.trans[L.idx] : '';
    } else if (L.status === 'ready') cur = '這份歌詞沒有時間軸';
    else if (L.status === 'searching' || L.status === 'loading') cur = '正在找歌詞…';
    else cur = s ? '沒有歌詞' : '還沒有播放歌曲';
    const lg = LANG_ATTR[L.lyricLang()] || '';
    const c = d.getElementById('c'), n = d.getElementById('n');
    c.textContent = cur; n.textContent = next;
    if (lg) { c.setAttribute('lang', lg); n.setAttribute('lang', lg); } else { c.removeAttribute('lang'); n.removeAttribute('lang'); }
    d.getElementById('tr').textContent = tr;
    d.getElementById('ti').textContent = s ? `${s.title} · ${s.artist}` : '';
  },
};

function lsItem(r, i, dur) {
  const kind = r.syncedLyrics ? '<span class="tagx sync">同步</span>' : r.plainLyrics ? '<span class="tagx plain">純文字</span>' : '<span class="tagx inst">純音樂</span>';
  const delta = dur && r.duration ? Math.round(r.duration - dur) : null;
  return `<button class="ls-item" type="button" data-i="${i}">
    <span class="t"${langAttr(detectScript(r.trackName))}>${esc(r.trackName || r.name)}</span>
    <span class="m">${kind}<span>${r.duration ? fmtTime(r.duration) : '–'}${delta != null && Math.abs(delta) >= 2 ? ` (${delta > 0 ? '+' : '−'}${Math.abs(delta)}s)` : ''}</span></span>
    <span class="s">${esc(r.artistName || '')}${r.albumName ? ' · ' + esc(r.albumName) : ''}</span>
  </button>`;
}

function previewHTML(r) {
  if (r.syncedLyrics) {
    const p = parseLRC(r.syncedLyrics);
    return p.lines.slice(0, 18).map(l => `<span class="ts">[${lrcTime(l.t)}]</span> ${esc(l.text)}`).join('\n') + (p.lines.length > 18 ? '\n…' : '');
  }
  if (r.plainLyrics) return esc(r.plainLyrics.split('\n').slice(0, 18).join('\n'));
  return '（純音樂，沒有歌詞）';
}

    foot: `<label class="check"><input type="checkbox" id="lsRemember" checked>記住這組關鍵字</label><span class="grow"></span>

    init: m => {
      const run = async () => {

          box.innerHTML = results.length ? results.map((r, i) => lsItem(r, i, dur)).join('') : '<p class="help">沒有找到。試試只填歌名，或改用原文、羅馬拼音、英文歌名。</p>';

/* ---------- Lyric editor: paste text / LRC, or tap along to stamp each line ---------- */

function edParse(text) {
  const out = [];
  for (const row of String(text || '').replace(/\r\n?/g, '\n').split('\n')) {
    if (/^\s*\[[a-zA-Z#]+\s*:[^\]]*\]\s*$/.test(row)) continue;
    let rest = row, t = null, m;
    while ((m = rest.match(TIME_TAG))) { if (t == null) t = tagToSec(m); rest = rest.slice(m[0].length); }
    const txt = rest.replace(/<\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?>/g, '').trim();
    if (!txt && t == null) continue;
    out.push({ t, text: txt });
  }
  return out;
}

function edSerialize(lines) {
  return lines.map(l => (l.t != null ? `[${lrcTime(l.t)}]` : '') + l.text).join('\n');
}

              <span class="ed-nudge"><button type="button" data-ed="nudge" data-d="-0.1">−0.1</button><button type="button" data-ed="nudge" data-d="0.1">+0.1</button><button type="button" data-ed="clear-t">清除</button></span>
            </div>`).join('')
          : '<p class="help" style="padding:14px">還沒有歌詞。先到「文字 / LRC」貼上歌詞。</p>';
        const ptrEl = box.querySelector('.ed-row.ptr');
        if (ptrEl) {
          const top = ptrEl.offsetTop - box.clientHeight / 2 + ptrEl.offsetHeight / 2;
          box.scrollTo({ top, behavior: reducedMotion() ? 'auto' : 'smooth' });
        }
        Ed.live = -2;
      };
      const setMode = mode2 => {
        if (mode2 === 'text' && Ed.mode === 'tap') m.$('#edTextarea').value = edSerialize(Ed.lines);
        if (mode2 === 'tap' && Ed.mode === 'text') {
          Ed.lines = edParse(m.$('#edTextarea').value);
          const firstOpen = Ed.lines.findIndex(l => l.t == null);
          Ed.ptr = firstOpen < 0 ? Ed.lines.length : firstOpen;
          Ed.sel = -1;
        }
        Ed.mode = mode2;
        $$('[data-ed="mode"]', m.el).forEach(b => { b.classList.toggle('on', b.dataset.m === mode2); b.setAttribute('aria-selected', b.dataset.m === mode2 ? 'true' : 'false'); });
        m.$('#edTap').hidden = mode2 !== 'tap';
        m.$('#edText').hidden = mode2 !== 'text';
        if (mode2 === 'tap') draw(); else setTimeout(() => m.$('#edTextarea').focus(), 20);
      };
      Object.assign(Ed, { draw });
      m.$('#edTextarea').value = edSerialize(Ed.lines);

      const loop = () => {
        const cur = isCur();
        m.$('#edNotCur').hidden = cur;
        const t = cur ? Player.time() : 0;
        const cs = Math.floor(t * 100);
        if (cs !== Ed.shownSec) { Ed.shownSec = cs; m.$('#edTime').textContent = fmtTime(t) + '.' + String(cs % 100).padStart(2, '0'); }
        if (Ed.mode === 'tap' && cur) {
          let live = -1, best = -Infinity;
          Ed.lines.forEach((l, i) => { if (l.t != null && l.t <= t && l.t > best) { best = l.t; live = i; } });
          if (live !== Ed.live) {
            Ed.live = live;
            $$('.ed-row', m.el).forEach(r => r.classList.toggle('live', +r.dataset.i === live));
          }
        }
        Ed.raf = requestAnimationFrame(loop);
      };
      Ed.raf = requestAnimationFrame(loop);

      m.el.addEventListener('click', async e => {
        const b = e.target.closest('[data-ed]');
        const row = e.target.closest('.ed-row');
        if (!b && row) {
          const i = +row.dataset.i;
          Ed.ptr = i; Ed.sel = i;
          const l = Ed.lines[i];
          if (l && l.t != null && isCur()) Player.seek(Math.max(0, l.t - 2));
          draw();
          return;
        }
        if (!b) return;
        const act = b.dataset.ed;
        if (act === 'mode') setMode(b.dataset.m);
        else if (act === 'tap') tap();
        else if (act === 'undo') undo();
        else if (act === 'toggle') { if (isCur()) Player.toggle(); else playThis(); }
        else if (act === 'back') { if (isCur()) Player.seek(Player.time() - 3); }
        else if (act === 'restart') { if (isCur()) { Player.seek(0); Player.play(); } else playThis(); Ed.ptr = 0; Ed.sel = -1; draw(); }
        else if (act === 'playthis') playThis();
        else if (act === 'nudge') { e.stopPropagation(); const l = Ed.lines[+b.closest('.ed-row').dataset.i]; if (l && l.t != null) { l.t = Math.max(0, round2(l.t + +b.dataset.d)); draw(); } }
        else if (act === 'clear-t') { e.stopPropagation(); const i = +b.closest('.ed-row').dataset.i; Ed.lines[i].t = null; Ed.ptr = i; draw(); }
        else if (act === 'cancel') m.close();
        else if (act === 'export') {
          const lines = Ed.mode === 'text' ? edParse(m.$('#edTextarea').value) : Ed.lines;
          const stamped = lines.filter(l => l.t != null);
          if (!stamped.length) { toast('還沒有任何有時間的歌詞可以匯出'); return; }
          downloadLrc(song(id), stamped);
        } else if (act === 'save') {
          await saveEd();
          m.close();
        }
      });

      const playThis = () => { Queue.playNow(id); };
      function tap() {
        if (!isCur()) { toast('先播放這首歌，再跟著打點'); return; }
        if (!Ed.lines.length) { setMode('text'); return; }
        if (Ed.ptr >= Ed.lines.length) { toast('每一句都打點完了，可以按「儲存歌詞」'); return; }
        Ed.lines[Ed.ptr].t = Math.max(0, round2(Player.time() - 0.15));
        Ed.sel = Ed.ptr;
        Ed.ptr++;
        draw();
      }
      function undo() {
        if (Ed.ptr <= 0) return;
        Ed.ptr--;
        Ed.lines[Ed.ptr].t = null;
        Ed.sel = -1;
        draw();
      }
      Object.assign(Ed, { tap, undo });
      async function saveEd() {
        const cur = song(id);
        let newRec;
        if (Ed.mode === 'text') {
          const text = m.$('#edTextarea').value.trim();
          const p = parseLRC(text);
          if (!text || !p.lines.length) newRec = { kind: 'none', manual: true, at: Date.now() };
          else if (p.synced) newRec = { kind: 'synced', lrc: text, plain: p.lines.map(l => l.text).join('\n'), source: 'manual', at: Date.now() };
          else newRec = { kind: 'plain', lrc: '', plain: text, source: 'manual', at: Date.now() };
        } else {
          const stamped = Ed.lines.filter(l => l.t != null);
          const plain = Ed.lines.map(l => l.text).join('\n');
          if (!stamped.length) newRec = Ed.lines.length ? { kind: 'plain', lrc: '', plain, source: 'manual', at: Date.now() } : { kind: 'none', manual: true, at: Date.now() };
          else {
            const skipped = Ed.lines.length - stamped.length;
            newRec = { kind: 'synced', lrc: serializeLRC(stamped, { ti: cur.title, ar: cur.artist }), plain, source: 'tap', at: Date.now() };
            if (skipped) toast(`${skipped} 句還沒有時間，已先略過`);
          }
        }
        if (newRec.kind === 'synced') cur.offset = 0;
        Store.save();
        await Lyrics.save(id, newRec);
        toast('歌詞已儲存');
      }
      setMode(Ed.mode);
    },
  });
  function draw() { if (Ed.draw) Ed.draw(); }
  function tap() { if (Ed.tap) Ed.tap(); }
  function undo() { if (Ed.undo) Ed.undo(); }
}

const FILE_MSG = `<strong>請用網頁伺服器開啟這個檔案。</strong> 直接用檔案開啟（file://）時，YouTube 播放器會拒絕播放（錯誤 153）。在 index.html 所在資料夾執行 <code>python3 -m http.server 8000</code>，再打開 <code>http://localhost:8000</code>；或把檔案放到 GitHub Pages、Netlify 等網站空間。`;
const REFERRER_MSG = `<strong>YouTube 播放器回報錯誤 153。</strong> 通常是網站伺服器送出了 <code>Referrer-Policy: no-referrer</code> 或 <code>same-origin</code>，YouTube 收不到來源網址。請把伺服器的 Referrer-Policy 改成 <code>strict-origin-when-cross-origin</code>。`;
const TL_OPTIONS = [['zh-TW', '繁體中文'], ['zh-CN', '简体中文'], ['en', 'English'], ['ja', '日本語'], ['ko', '한국어']];
const tlName = tl => (TL_OPTIONS.find(x => x[0] === tl) || [tl, tl])[1];

/* ---------- Song objects ---------- */

function applyMeta(s, meta) {
  if (!meta) return s;
  if (meta.rawTitle) s.rawTitle = meta.rawTitle;
  if (meta.channel) s.channel = meta.channel;
  if (meta.duration) s.duration = meta.duration;
  if (meta.embeddable === false) s.unavailable = 'embed';
  if (!s.edited && s.rawTitle) {
    const p = parseVideoTitle(s.rawTitle, s.channel);
    s.title = p.title;
    s.artist = p.artist;
    s.origArtist = p.origArtist;
    s.cover = p.cover;
  }
  return s;
}

function newSong(id, meta) {
  return applyMeta({
    id, rawTitle: '', channel: '', title: id, artist: '', origArtist: '', cover: false, album: '',
    duration: 0, added: 0, plays: 0, offset: 0, trans: null, ly: '',
  }, meta);
}

function setMediaSession(s) {
  if (!('mediaSession' in navigator) || !s) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title, artist: s.artist || '', album: transOf(s) || '',
      artwork: [{ src: thumb(s.id, 'hq'), sizes: '480x360', type: 'image/jpeg' }],
    });
  } catch (e) { /* unsupported */ }
}

/* ---------- Callbacks from the player and services ---------- */

const App = {
  loggedFor: null,
  errStreak: 0,
  onTrackChange(id) {
    const s = song(id);
    this.loggedFor = null;
    Bar.track(s);
    Bar.playState();
    NP.render();
    markCurrent();
    this.queueChanged();
    Lyrics.load(id);
    setMediaSession(s);
    $('#miniVideo').hidden = !S().showVideo || !id;
    if (Router.cur && Router.cur.name === 'home') rerender();
  },
  onPlaying() {
    const id = Player.id;
    const s = song(id);
    this.errStreak = 0;
    if (!s) return;
    let changed = false;
    if (this.loggedFor !== id) { this.loggedFor = id; pushHistory(id); s.plays = (s.plays || 0) + 1; changed = true; }
    const d = Math.round(Player.yt && Player.yt.getDuration ? Player.yt.getDuration() : 0);
    if (d && Math.abs((s.duration || 0) - d) > 1) { s.duration = d; changed = true; }
    if (s.unavailable) { delete s.unavailable; changed = true; }
    if (!s.rawTitle) {
      const vd = Player.videoData();
      if (vd && vd.title) {
        applyMeta(s, { rawTitle: vd.title, channel: vd.author || '' });
        if (S().autoTrans) TransQ.push(id);
        Bar.track(s);
        NP.render();
        changed = true;
      }
    }
    if (changed) { Store.save(); rerender(); }
    setMediaSession(s);
  },
  onEnded() {
    if (Sleep.endOfTrack) { Sleep.fire(); return; }
    Queue.next(true);
  },
  onPlayerError(code) {
    const id = Player.id;
    const s = song(id);
    const title = s ? s.title : id;
    let msg;
    if (code === 101 || code === 150) { msg = `「${title}」的上傳者不允許在其他網站播放`; if (s) s.unavailable = 'embed'; }
    else if (code === 100) { msg = `找不到「${title}」，影片可能已刪除或設為私人`; if (s) s.unavailable = 'gone'; }
    else if (code === 153) { Banner.show('referrer', location.protocol === 'file:' ? FILE_MSG : REFERRER_MSG); msg = 'YouTube 拒絕播放：沒有收到網頁來源（錯誤 153）'; }
    else if (code === 2) msg = '影片 ID 格式錯誤';
    else msg = `播放失敗（YouTube 錯誤 ${code}）`;
    Store.save();
    rerender();
    toast(msg, id ? { action: { label: '在 YouTube 開啟', href: ytWatch(id) } } : {});
    this.errStreak++;
    const q = Store.data.queue;
    if (code !== 153 && code !== 2 && q.ids.length > 1 && this.errStreak < Math.min(q.ids.length, 6)) {
      setTimeout(() => { if (Player.id === id) Queue.skip(); }, 900);
    }
  },
  songChanged(id) {
    if (id === Queue.current()) { Bar.track(song(id)); NP.render(); }
    rerender();
    this.queueChanged();
  },
  queueChanged() { Drawer.render(); NP.renderQueue(); },
  refreshAll() {
    Bar.track(song(Queue.current()));
    NP.render();
    this.queueChanged();
    rerender();
  },
};

/* ---------- Add songs ---------- */

async function importLinks(text, { target = '', newName = '', useHints = false, onProgress = () => {} } = {}) {
  const p = parseYouTubeInput(text);
  const lists = useHints ? unique([...p.lists, ...p.listHints]) : p.lists;
  const errors = [];
  let ids = [], known = {}, listTitle = '';
  for (const l of lists) {
    onProgress(0, 0, '正在讀取 YouTube 播放清單…');
    try {
      const r = await resolvePlaylist(l);
      ids.push(...r.ids);
      Object.assign(known, r.known);
      listTitle = listTitle || r.title;
    } catch (e) {
      errors.push('有一個播放清單無法讀取（可能是私人清單）');
    }
  }
  ids = unique([...p.videos, ...ids]);
  if (!ids.length) return { added: 0, total: 0, errors, plId: null };
  const need = ids.filter(id => !song(id) || !song(id).rawTitle);
  let done = 0;
  onProgress(0, need.length, `讀取歌曲資訊 0 / ${need.length}`);
  await runPool(need.map(id => async () => {
    const meta = known[id] || await fetchMeta(id);
    const s = song(id);
    if (s) applyMeta(s, meta); else Store.data.songs[id] = newSong(id, meta);
    done++;
    onProgress(done, need.length, `讀取歌曲資訊 ${done} / ${need.length}`);
  }), 3);
  ids.forEach(id => { if (!song(id)) Store.data.songs[id] = newSong(id, null); });
  const added = Lib.addMany(ids);
  let plId = null;
  if (target === '__yt' || target === '__new') {
    const name = target === '__new' ? newName : (listTitle || newName || 'YouTube 播放清單');
    plId = Lib.createPlaylist(name).id;
  } else if (target) plId = target;
  if (plId) Lib.addToPlaylist(plId, ids);
  Store.save();
  renderSidebar();
  if (S().autoTrans) ids.forEach(id => TransQ.push(id));
  return { added, total: ids.length, errors, plId, ids };
}

function openAdd(prefill = '', opts = {}) {

  let useHints = false, busy = false;
  Modal.open({
    title: '加入歌曲',
    body: `<label class="field"><span>YouTube 連結</span>
        <textarea class="textarea" id="addInput" rows="5" spellcheck="false" placeholder="https://www.youtube.com/watch?v=…&#10;https://youtu.be/…&#10;https://www.youtube.com/playlist?list=…">${esc(prefill)}</textarea></label>

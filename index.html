<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="以 YouTube 為音源的音樂播放器：同步歌詞、原文歌名與翻譯、播放清單。">
<title>サシミュージック</title>
<meta name="application-name" content="サシミュージック">
<meta name="apple-mobile-web-app-title" content="サシミュージック">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Crect x='7' y='10' width='18' height='4' rx='2' fill='%23fff'/%3E%3Crect x='7' y='18' width='11' height='4' rx='2' fill='%2336e2d4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fontCss" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* サシミュージック — dark streaming shell in the Tidal manner.
   Layout: sidebar | scrolling main column | transport bar along the bottom.
   Overlays: now playing (lyrics first), queue drawer, menus, dialogs, toasts.
   The YouTube iframe lives in one fixed dock that is moved over whichever slot is visible. */
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #09090b;
  --surface: #131316;
  --surface-2: #1c1c21;
  --surface-3: #2a2a31;
  --line: #222228;
  --line-2: #33333b;
  --fg: #fff;
  --fg-2: #a9a9b4;
  --fg-3: #6e6e7a;
  --accent: #36e2d4;
  --accent-ink: #002420;
  --accent-soft: rgba(54, 226, 212, .13);
  --warn: #ffb547;
  --danger: #ff6b6b;
  --font-ui: "Geist", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ja: "Geist", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  --font-ko: "Geist", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sb-w: 244px;
  --bottom-ui: 88px;
  --r-sm: 4px;
  --r: 8px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --gutter: 32px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  text-rendering: optimizeLegibility;
}
:lang(ja) { font-family: var(--font-ja); }
:lang(ko) { font-family: var(--font-ko); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.i { width: 20px; height: 20px; flex: none; }
kbd { font: 11px/1 var(--font-mono); color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px; }
* { scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- Shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sb-w) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  height: 100%;
  height: 100dvh;
}
.sidebar {
  grid-column: 1; grid-row: 1;
  display: flex; flex-direction: column; gap: 22px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 12px 0 max(12px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line);
  overflow-y: auto; min-height: 0;
  background: var(--bg);
}
.main { grid-column: 2; grid-row: 1; overflow-y: auto; min-height: 0; position: relative; overscroll-behavior: contain; }
.view { padding-bottom: 48px; min-height: calc(100% - 68px); }

.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 2px 10px; font-size: 20px; font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.brand-name { min-width: 0; }
.brand-mark { display: grid; gap: 4px; width: 22px; flex: none; }
.brand-mark i { display: block; height: 4px; border-radius: 2px; background: var(--fg); }
.brand-mark i + i { width: 62%; background: var(--accent); }

.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 0 6px 2px 10px; color: var(--fg-3); font-size: 12px; font-weight: 500; letter-spacing: .08em; }
.nav-item { display: flex; align-items: center; gap: 12px; min-height: 38px; padding: 0 10px; border-radius: var(--r-sm); color: var(--fg-2); font-weight: 500; transition: color .15s, background .15s; }
.nav-item:hover { color: var(--fg); background: var(--surface); }
.nav-item.on { color: var(--fg); background: var(--surface-2); }
.nav-item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count { margin-left: auto; font: 12px var(--font-mono); font-style: normal; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.nav-pls .nav-item { min-height: 34px; font-size: 13.5px; }
.nav-pls .nav-item.drop { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
.nav-empty { margin: 2px 10px; color: var(--fg-3); font-size: 13px; }

.mini-video { position: sticky; bottom: 0; margin-top: auto; padding: 10px 0 14px; background: linear-gradient(to bottom, transparent, var(--bg) 18px); }
.mini-video-head { display: flex; align-items: center; gap: 2px; padding: 0 2px 6px 4px; color: var(--fg-3); font-size: 12px; letter-spacing: .08em; }
.mini-video-head span { flex: 1; }
.mini-video-slot { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--r-sm); background: var(--surface); overflow: hidden; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px; border-radius: 6px;
  font-weight: 600; font-size: 14px; white-space: nowrap;
  background: var(--surface-2); color: var(--fg);
  transition: background .15s, transform .1s, color .15s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.98); }
.btn .i { width: 18px; height: 18px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-light { background: var(--fg); color: #000; }
.btn-light:hover { background: #e4e4ea; }
.btn-ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: #210000; }
.btn-danger:hover { background: #ff8585; }
.icon-btn {
  display: inline-grid; place-items: center; flex: none;
  width: 36px; height: 36px; border-radius: 50%;
  color: var(--fg-2);
  transition: color .15s, background .15s, opacity .15s;
}
.icon-btn:hover { color: var(--fg); background: var(--surface-2); }
.icon-btn.on { color: var(--accent); }
.icon-btn.sm { width: 30px; height: 30px; }
.icon-btn.sm .i { width: 17px; height: 17px; }
.icon-btn.xs { width: 26px; height: 26px; }
.icon-btn.xs .i { width: 16px; height: 16px; }
.icon-btn.round { background: var(--surface); }
.icon-btn.round:hover { background: var(--surface-2); }
.like.on { color: var(--accent); }
.link { color: inherit; text-align: left; }
.link:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px;
  background: rgba(255, 255, 255, .07); color: var(--fg-2); font-size: 12.5px; font-weight: 500;
  transition: background .15s, color .15s;
}
.chip:hover { background: rgba(255, 255, 255, .12); color: var(--fg); }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip .i { width: 15px; height: 15px; }

.input, .textarea, .select {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 6px;
  background: var(--bg); border: 1px solid var(--line-2); color: var(--fg); outline: 0;
  transition: border-color .15s;
}
.textarea { height: auto; padding: 10px 12px; resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.65; }
.select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-2) 50%), linear-gradient(135deg, var(--fg-2) 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }

.slider { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 16px; margin: 0; background: transparent; cursor: pointer; --p: 0%; }
.slider:focus-visible { outline-offset: 0; }
.slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fg) var(--p), var(--surface-3) var(--p)); }
.slider:hover::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--p), var(--surface-3) var(--p)); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--fg); opacity: 0; transition: opacity .15s; }
.slider:hover::-webkit-slider-thumb, .slider:focus-visible::-webkit-slider-thumb, .slider.dragging::-webkit-slider-thumb { opacity: 1; }
.slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--surface-3); }
.slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fg); }
.slider:hover::-moz-range-progress { background: var(--accent); }
.slider::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--fg); opacity: 0; }
.slider:hover::-moz-range-thumb { opacity: 1; }

.switch { appearance: none; -webkit-appearance: none; flex: none; width: 40px; height: 22px; margin: 0; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .18s var(--ease); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  min-height: 68px; padding: 14px var(--gutter);
  background: rgba(0, 0, 0, .74);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
}
.tb-nav { display: flex; gap: 8px; }
.search {
  flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 10px 0 12px; border-radius: 6px;
  background: var(--surface); border: 1px solid transparent; color: var(--fg-3);
  transition: background .15s, border-color .15s;
}
.search:focus-within { background: var(--surface-2); border-color: var(--line-2); color: var(--fg-2); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--fg); }
.search input::placeholder { color: var(--fg-3); }
.search input::-webkit-search-cancel-button { filter: invert(.6); }
.tb-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.banner {
  display: flex; align-items: flex-start; gap: 12px;
  margin: 12px var(--gutter) 0; padding: 12px 14px 12px 16px; border-radius: var(--r);
  background: rgba(255, 181, 71, .08); border: 1px solid rgba(255, 181, 71, .32); color: #ffd9a0;
  font-size: 13.5px; line-height: 1.6;
}
.banner .grow { flex: 1; min-width: 0; }
.banner strong { color: #fff; font-weight: 600; }
.banner code { font-family: var(--font-mono); font-size: 12.5px; background: rgba(0, 0, 0, .45); color: #fff; padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }

/* ---------- Page headers & sections ---------- */
.phead { position: relative; isolation: isolate; display: flex; align-items: flex-end; gap: 28px; padding: 28px var(--gutter) 26px; }
.phead-bg { position: absolute; inset: -68px 0 0; z-index: -1; overflow: hidden; pointer-events: none; }
.phead-bg img { width: 100%; height: 100%; object-fit: cover; filter: blur(70px) saturate(1.5); transform: scale(1.3); opacity: .55; }
.phead-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, .1), var(--bg) 96%); }
.phead-art { width: clamp(132px, 17vw, 216px); aspect-ratio: 1; flex: none; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); box-shadow: 0 24px 60px rgba(0, 0, 0, .55); display: grid; place-items: center; color: var(--fg-3); }
.phead-art > .i { width: 44%; height: 44%; }
.phead-info { min-width: 0; flex: 1; }
.kicker { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .1em; color: var(--fg-2); }
.phead h1, .page-title { margin: 6px 0 8px; font-size: clamp(30px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -.035em; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.phead-desc { margin: 0 0 6px; color: var(--fg-2); max-width: 62ch; }
.phead-sub { color: var(--fg-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.phead-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.page-pad { padding: 24px var(--gutter) 8px; }

.section { padding: 10px var(--gutter) 30px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.section-head a { color: var(--fg-2); font-size: 13px; font-weight: 500; }
.section-head a:hover { color: var(--fg); }

.mosaic { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; }
.mosaic.one { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.mosaic.one img { transform: scale(1.34); }

/* ---------- Track list ---------- */
.tlist { display: flex; flex-direction: column; padding: 0 calc(var(--gutter) - 12px); }
.thead, .trow {
  display: grid;
  grid-template-columns: 36px minmax(0, 4fr) minmax(0, 2fr) minmax(0, 2fr) minmax(0, 1.1fr) 36px 52px 36px;
  align-items: center; column-gap: 12px; padding: 0 12px;
}
.thead { height: 38px; color: var(--fg-3); font-size: 12px; letter-spacing: .06em; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.thead .i { width: 15px; height: 15px; }
.trow { position: relative; min-height: 60px; border-radius: var(--r-sm); transition: background .12s; cursor: default; user-select: none; -webkit-user-select: none; }
.trow:hover, .trow:focus-within { background: var(--surface); }
.trow.dragging { opacity: .4; }
.trow.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.trow.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.trow.is-off .tt, .trow.is-off .thumb { opacity: .45; }
.c-idx { position: relative; display: grid; place-items: center; height: 36px; color: var(--fg-3); font: 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.c-idx .row-play, .c-idx .eq { display: none; }
.trow:hover .c-idx .n, .trow.is-current .c-idx .n { display: none; }
.trow.is-current .c-idx .eq { display: flex; }
.trow:hover .c-idx .eq { display: none; }
.trow:hover .c-idx .row-play { display: grid; }
.row-play { place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--fg); }
.row-play .i { width: 17px; height: 17px; }
.c-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.thumb { position: relative; width: 44px; height: 44px; flex: none; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.tt { min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.32; }
.t1 { display: flex; align-items: center; gap: 7px; min-width: 0; font-weight: 500; }
.t1 .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow.is-current .t1 .tx, .qrow.cur .t1 .tx { color: var(--accent); }
.t2 { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t3 { font-size: 12.5px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge-lrc { flex: none; font: 600 9.5px/1 var(--font-mono); letter-spacing: .06em; padding: 3px 4px 2px; border-radius: 3px; color: var(--accent); box-shadow: inset 0 0 0 1px rgba(54, 226, 212, .5); }
.badge-off { flex: none; font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px; color: var(--warn); box-shadow: inset 0 0 0 1px rgba(255, 181, 71, .45); }
.c-artist, .c-src, .c-extra { min-width: 0; color: var(--fg-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-src, .c-extra { color: var(--fg-3); }
.c-extra { font-variant-numeric: tabular-nums; }
.c-dur { font: 12.5px var(--font-mono); color: var(--fg-3); text-align: right; font-variant-numeric: tabular-nums; }
.c-like, .c-more { display: grid; place-items: center; }
.trow .c-like .icon-btn, .trow .c-more .icon-btn { opacity: 0; width: 32px; height: 32px; }
.trow .c-like .icon-btn .i, .trow .c-more .icon-btn .i { width: 18px; height: 18px; }
.trow:hover .c-like .icon-btn, .trow:hover .c-more .icon-btn, .trow:focus-within .icon-btn, .trow .c-like .icon-btn.on { opacity: 1; }
.m-only { display: none; }

.eq { gap: 2px; align-items: flex-end; height: 14px; }
.eq i { display: block; width: 3px; height: 14px; background: var(--accent); border-radius: 1px; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.45s; }
.eq i:nth-child(3) { animation-delay: -.75s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
body.paused .eq i { animation-play-state: paused; }

.empty { padding: 40px var(--gutter); color: var(--fg-2); text-align: center; }
.empty h3 { margin: 0 0 6px; color: var(--fg); font-size: 18px; font-weight: 600; }
.empty p { margin: 0 auto 18px; max-width: 46ch; }
.empty.sm { padding: 14px 12px; font-size: 13px; text-align: left; color: var(--fg-3); }

/* ---------- Cards ---------- */
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(148px, 176px); gap: 18px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scroll-snap-type: x proximity; }
.card { scroll-snap-align: start; display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
.card-art { position: relative; aspect-ratio: 1; margin-bottom: 10px; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.card-art > img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); transition: transform .4s var(--ease); }
.card:hover .card-art > img { transform: scale(1.4); }
.card-art .mosaic img { transition: transform .4s var(--ease); }
.card-art .icon-ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--fg-3); }
.card-art .icon-ph .i { width: 40%; height: 40%; }
.card-play { position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--fg); color: #000; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s var(--ease); }
.card:hover .card-play, .card:focus-within .card-play { opacity: 1; transform: none; }
.card.is-current .card-t1 { color: var(--accent); }
.card-t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-t2 { font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-t3 { font-size: 12.5px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px 18px; }
.artist-card .card-art, .phead-art.round { border-radius: 50%; }
.artist-card .card-t1, .artist-card .card-t3 { text-align: center; }

/* ---------- Player bar ---------- */
.playerbar {

}
.pb-hairline { display: none; }
.pb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

.pb-right { display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.has-badge { position: relative; }
.badge { position: absolute; top: -2px; right: -6px; padding: 2px 4px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font: 600 9.5px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Now playing ---------- */
.np { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #000; overflow: hidden; animation: npIn .32s var(--ease); }

.np-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }

.np-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 6px max(24px, env(safe-area-inset-left, 0px)); }
.np-context { flex: 1; min-width: 0; text-align: center; font-size: 12px; letter-spacing: .08em; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.np-body {
  position: relative; z-index: 1; flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(28px, 4vw, 64px);
  padding: 4px max(48px, env(safe-area-inset-right, 0px)) calc(var(--bottom-ui) + 20px) max(48px, env(safe-area-inset-left, 0px));
}

.np-cover { width: 100%; height: 100%; object-fit: cover; }
.np-meta { display: flex; align-items: flex-start; gap: 12px; max-width: 720px; }
.np-meta-text { flex: 1; min-width: 0; }
.np-title { margin: 0; font-size: clamp(24px, 2.6vw, 38px); line-height: 1.14; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.np-trans { margin-top: 6px; font-size: 17px; color: var(--fg-2); overflow-wrap: anywhere; }
.np-artist { margin-top: 8px; font-size: 15px; color: var(--fg-2); text-align: left; }
.np-artist:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.np-right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.np-tabs { display: flex; gap: 26px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.np-tabs button { position: relative; padding: 12px 0 11px; color: var(--fg-2); font-weight: 600; transition: color .15s; }
.np-tabs button:hover { color: var(--fg); }

.np-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--fg); }
.np-panel { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- Lyrics ---------- */
.ly-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 12px 0 6px; font-size: 12.5px; color: var(--fg-2); }
.ly-toolbar .grow { flex: 1; }
.ly-src { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255, 255, 255, .06); font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.ly-src b { font: 600 10px var(--font-mono); letter-spacing: .06em; color: var(--accent); }
.ly-offset { display: inline-flex; align-items: center; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, .07); }
.ly-offset > button { display: grid; place-items: center; height: 28px; padding: 0 8px; color: var(--fg-2); border-radius: 999px; }
.ly-offset > button:hover { color: var(--fg); background: rgba(255, 255, 255, .08); }
.ly-offset > button .i { width: 14px; height: 14px; }
.ly-offset .val { min-width: 74px; font: 500 12px var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.ly-hint { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; padding: 9px 12px; border-radius: 6px; background: var(--accent-soft); color: #c9fbf6; font-size: 13px; }
.ly-hint .grow { flex: 1; }
.ly-scroll {
  position: relative; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 6px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 80%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 80%, transparent 100%);
}
.ly-scroll::-webkit-scrollbar { display: none; }
.ly-lines { --ly: calc(clamp(22px, 2.25vw, 34px) * var(--ly-scale, 1)); padding: 22vh 0 46vh; }
.ly-line {
  display: block; width: 100%; padding: 9px 0; text-align: left;
  font-size: var(--ly); font-weight: 700; line-height: 1.32; letter-spacing: -.012em;
  color: rgba(255, 255, 255, .3); cursor: pointer; overflow-wrap: anywhere;
  transition: color .35s ease, opacity .35s ease;
}
.ly-line:hover { color: rgba(255, 255, 255, .6); }
.ly-line.past { color: rgba(255, 255, 255, .38); }
.ly-line.on { color: #fff; }
.ly-line .ly-tr { display: block; margin-top: 3px; font-size: .56em; font-weight: 500; letter-spacing: 0; opacity: .85; }
.ly-line .w { transition: color .18s; }
.ly-line.on .w { color: rgba(255, 255, 255, .42); }
.ly-line.on .w.sung { color: #fff; }
.ly-gap .dots { display: inline-flex; gap: .3em; padding: .2em 0; }
.ly-gap .dots i { width: .32em; height: .32em; border-radius: 50%; background: currentColor; opacity: .7; }
.ly-gap.on .dots i { animation: dot 1.4s ease-in-out infinite; }
.ly-gap.on .dots i:nth-child(2) { animation-delay: .2s; }
.ly-gap.on .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%, 100% { transform: scale(.7); opacity: .45; } 50% { transform: scale(1); opacity: 1; } }
.ly-lines.plain .ly-line { cursor: text; user-select: text; -webkit-user-select: text; color: rgba(255, 255, 255, .82); font-size: calc(var(--ly) * .78); padding: 5px 0; }

.calibrating .ly-line:hover { color: var(--accent); }

.ly-state { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 460px; padding: 18vh 0 0; }

/* ---------- Info panel ---------- */
.info-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 22px; margin: 6px 0 22px; font-size: 13.5px; }

/* ---------- Queue ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: var(--bottom-ui); z-index: 35; width: min(400px, 100%); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -30px 0 70px rgba(0, 0, 0, .55); animation: drawerIn .24s var(--ease); }

.drawer-head { display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 10px 20px; }
.drawer-head h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
.drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 24px; }

.np .qrow:hover { background: rgba(255, 255, 255, .07); }

/* ---------- Video dock ---------- */
.video-dock { position: fixed; left: 0; top: 0; z-index: 6; width: 320px; height: 180px; overflow: hidden; border-radius: var(--r-sm); background: #000; transform: translate(-10000px, 0); }
.video-dock iframe { display: block; width: 100%; height: 100%; border: 0; }

.menu { position: fixed; z-index: 220; min-width: 224px; max-width: min(320px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow-y: auto; padding: 6px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line-2); box-shadow: 0 18px 50px rgba(0, 0, 0, .65); animation: pop .12s var(--ease); }

.menu-label { padding: 8px 10px 4px; color: var(--fg-3); font-size: 11.5px; letter-spacing: .08em; }

/* ---------- Dialogs ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 160; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, .62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .15s; }

/* lyric search */

<script>
(() => {
'use strict';
/* =====================================================================
   Pure helpers — no DOM access. The Node test suite loads this file too.
   ===================================================================== */

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const unique = arr => Array.from(new Set(arr));
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const norm = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, '');
const round1 = n => Math.round(n * 10) / 10;
const round2 = n => Math.round(n * 100) / 100;

function shuffleInPlace(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(sec) {
  if (!Number.isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}

function fmtLong(sec) {
  const m = Math.round((sec || 0) / 60);
  if (m < 60) return `${m} 分鐘`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} 小時 ${r} 分` : `${h} 小時`;
}

function fmtOffset(o) {
  o = round1(o || 0);
  return (o > 0 ? '+' : o < 0 ? '−' : '±') + Math.abs(o).toFixed(1) + ' 秒';
}

function relTime(ts, now = Date.now()) {
  const d = (now - ts) / 1000;
  if (d < 60) return '剛剛';
  if (d < 3600) return `${Math.floor(d / 60)} 分鐘前`;
  if (d < 86400) return `${Math.floor(d / 3600)} 小時前`;
  if (d < 172800) return '昨天';
  if (d < 604800) return `${Math.floor(d / 86400)} 天前`;
  const t = new Date(ts);
  return `${t.getFullYear()}/${t.getMonth() + 1}/${t.getDate()}`;
}

/* ISO-8601 duration from the YouTube Data API, e.g. PT4M13S */
function isoDur(s) {
  const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(String(s || ''));
  if (!m) return 0;
  return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0);
}

/* ---------- Script / language detection ---------- */

const RE_KANA = /[\u3040-\u30ff\u31f0-\u31ff\uff66-\uff9f]/;
const RE_HANGUL = /[\uac00-\ud7af\u1100-\u11ff\u3130-\u318f]/;
const RE_HAN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;
const RE_LATIN = /[A-Za-z\u00c0-\u024f]/;

function detectScript(text) {
  const t = String(text || '');
  if (RE_KANA.test(t)) return 'ja';
  if (RE_HANGUL.test(t)) return 'ko';
  if (RE_HAN.test(t)) return 'zh';
  if (RE_LATIN.test(t)) return 'en';
  return '';
}

const baseLang = code => String(code || '').toLowerCase().split(/[-_]/)[0];
const sameLang = (a, b) => !!baseLang(a) && baseLang(a) === baseLang(b);

/* ---------- YouTube links ---------- */

const YT_ID = /^[\w-]{11}$/;
const looksLikeBareId = t => YT_ID.test(t) && (/[\d_-]/.test(t) || (/[a-z]/.test(t) && /[A-Z]/.test(t)));

function parseYouTubeInput(text) {
  const out = { videos: [], lists: [], listHints: [] };
  const tokens = String(text || '').split(/[\s,，、]+/).filter(Boolean);
  for (let tok of tokens) {
    tok = tok.replace(/^[<(「『"'\[]+/, '').replace(/[>)」』"'\].,，。]+$/, '');
    if (!tok) continue;
    if (looksLikeBareId(tok)) { out.videos.push(tok); continue; }
    if (/^(PL|OLAK5uy_|UU|FL|LL|OL)[\w-]{10,}$/.test(tok)) { out.lists.push(tok); continue; }
    let u;
    try { u = new URL(/^https?:\/\//i.test(tok) ? tok : 'https://' + tok); } catch (e) { continue; }
    const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, '');
    let vid = null;
    const list = u.searchParams.get('list');
    if (host === 'youtu.be') vid = u.pathname.split('/')[1] || null;
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') vid = u.searchParams.get('v');
      else {
        const m = u.pathname.match(/^\/(?:shorts|embed|live|v|e)\/([\w-]{11})/);
        if (m) vid = m[1];
      }
    } else continue;
    if (vid && YT_ID.test(vid)) {
      out.videos.push(vid);
      if (list && !/^RD/.test(list)) out.listHints.push(list);
    } else if (list && /^[\w-]{10,}$/.test(list)) {
      out.lists.push(list);
    }
  }
  out.videos = unique(out.videos);
  out.lists = unique(out.lists);
  out.listHints = unique(out.listHints).filter(l => !out.lists.includes(l));
  return out;
}

/* ---------- Video title → song title / artist ----------
   Handles the common YouTube music title shapes:
   Artist「Title」MV · Title / Artist(Cover) · Artist - Title (Official Video)
   【歌ってみた】Title / Original covered by Singer · Artist【中文歌名】Official MV
   Artist 'Title' MV · auto-generated "Artist - Topic" uploads           */

const NOISE_ASCII = ['official', 'music video', 'lyric video', 'lyrics', 'lyric', 'mv', 'm/v', 'pv', 'video',
  'audio', 'visualizer', '4k', 'hd', 'hq', 'cover', 'covered', 'original', 'teaser', 'trailer', 'live',
  'full ver', 'full size', 'full version', 'tv size', 'short ver', 'music clip', 'special movie', 'animation',
  'shorts', '3dmv', '3d mv', 'mmd', 'remaster', 'remastered', 'premiere'];
const NOISE_CJK = ['公式', '官方', '歌詞', '中字', '中日', '日中', '字幕', '高音質', '高画質', '歌ってみた', 'カバー',
  '翻唱', 'オリジナル', '原創', '新曲', '試聴', '視聴', 'ライブ', 'アニメ', '繁中', '簡中', '简中', '中文',
  '完整版', '動態歌詞', '动态歌词', '純享', '纯享', '首播', 'プレミア'];
const NOISE_ASCII_RE = new RegExp('(?:^|[^a-z])(?:' + NOISE_ASCII
  .map(w => w.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&').replace(/ /g, '\\s*')).join('|') + ')(?:[^a-z]|$)', 'i');

function isNoiseTag(inner) {
  const s = String(inner || '').trim();
  if (!s || s.startsWith('#')) return true;
  if (NOISE_ASCII_RE.test(s)) return true;
  const c = s.replace(/ホロライブ|にじさんじ|ぶいすぽ/g, ''); // agency names that contain noise words
  return NOISE_CJK.some(w => c.includes(w));
}

const TRAIL_NOISE = /(?:^|\s|(?<=[^\x00-\x7f]))(?:(?:official\s+)?(?:music\s+video|lyric\s+video|mv|m\/v|pv)|official\s+(?:video|audio|visualizer|clip)|公式\s*mv|官方\s*mv|公式|官方)\s*$/i;
const LEAD_NOISE = /^(?:(?:official\s+)?(?:mv|m\/v|pv)|music\s+video)(?:\s+|$)/i;
const EDGE_PUNCT = /^[\s\-–—~〜|:：・/\\,，、]+|[\s\-–—~〜|:：・/\\,，、]+$/g;

function cleanPart(s) {
  s = String(s || '').replace(/#\S+/g, ' ').replace(/\s+/g, ' ').trim();
  for (let k = 0; k < 4; k++) {
    const before = s;
    s = s.replace(TRAIL_NOISE, '').replace(LEAD_NOISE, '').replace(EDGE_PUNCT, '').trim();
    if (s === before) break;
  }
  return s;
}

function prepTitle(raw) {
  return String(raw || '')
    .replace(/[\u3000\u00a0]/g, ' ')
    .replace(/／/g, '/').replace(/｜/g, '|').replace(/－/g, '-')
    .replace(/（/g, '(').replace(/）/g, ')').replace(/［/g, '[').replace(/］/g, ']')
    .replace(/\s+/g, ' ').trim();
}

function cleanChannel(chan) {
  const c = String(chan || '').trim();
  const out = c.replace(/\s*-\s*Topic$/i, '')
    .replace(/\b(?:official\s+)?(?:youtube\s+)?channel\b/ig, '')
    .replace(/\bch\.\s*/ig, '')
    .replace(/\s+/g, ' ').trim();
  return out || c;
}

/* Decide which side of "A - B" / "A / B" is the artist, using the channel name when it helps */
function orient(a, b, chan, order) {
  const nc = norm(chan);
  const hit = x => { const n = norm(x); return nc.length >= 2 && n.length >= 2 && (nc.includes(n) || n.includes(nc)); };
  if (order === 'title-first') return hit(a) && !hit(b) ? [b, a] : [a, b];
  return hit(b) && !hit(a) ? [a, b] : [b, a];
}

const SLASH_SPLIT = /^(.+?)(?:\s+\/\s*|\s*\/\s+|(?<=[^\x00-\x7f])\/|\/(?=[^\x00-\x7f]))(.+)$/;

function parseVideoTitle(raw, channel = '') {
  const original = prepTitle(raw);
  const chanName = cleanChannel(channel);
  if (/\s-\sTopic$/i.test(String(channel || '').trim())) {
    return { title: original, artist: chanName, origArtist: '', cover: false };
  }
  let cover = /歌ってみた|翻唱|カバー|(?:^|[^a-z])cover(?:ed)?(?:[^a-z]|$)/i.test(original);
  const tags = [];
  let s = original.replace(/【([^】]*)】|\[([^\]]*)\]|〔([^〕]*)〕|〖([^〗]*)〗/g, (m, a, b, c, d) => {
    const inner = (a ?? b ?? c ?? d ?? '').trim();
    if (inner && !isNoiseTag(inner)) tags.push(inner);
    return ' ';
  });
  s = s.replace(/\(([^()]*)\)/g, (m, inner) => (isNoiseTag(inner) ? ' ' : m));
  s = cleanPart(s);

  let title = '', artist = '', origArtist = '', m;
  if ((m = s.match(/^(.+?)\s*\/\s*(.+?)\s+covered\s+by\s+(.+)$/i))) {
    title = m[1]; origArtist = m[2]; artist = m[3]; cover = true;
  } else if ((m = s.match(/^(.+?)\s+covered\s+by\s+(.+)$/i))) {
    title = m[1]; artist = m[2]; cover = true;
  } else if ((m = s.match(/^(.*?)[「『《〈]([^」』》〉]+)[」』》〉](.*)$/))) {
    title = m[2]; artist = cleanPart(m[1]) || cleanPart(m[3]);
  } else if ((m = s.match(/^(.*?\S)\s+['"‘“]([^'"’”]+)['"’”](.*)$/))) {
    title = m[2]; artist = m[1];
  } else if ((m = s.match(SLASH_SPLIT))) {
    [title, artist] = orient(m[1], m[2], chanName, 'title-first');
  } else if ((m = s.match(/^(.+?)\s+[-–—|~〜]\s+(.+)$/))) {
    [title, artist] = orient(m[1], m[2], chanName, 'artist-first');
  } else if (tags.length && s) {
    title = tags.shift(); artist = s;
  } else {
    title = s || tags.shift() || original;
  }

  title = cleanPart(title);
  artist = cleanPart(artist).replace(/\(\s*(?:cover(?:ed)?|official)\s*\)/ig, '').trim();
  origArtist = cleanPart(origArtist);
  if (cover && tags.length && !origArtist) {
    const performer = tags[0].split(/[\/・,、]/)[0].trim();
    if (performer && norm(performer) !== norm(artist)) { origArtist = artist; artist = performer; }
  }
  if (!artist) artist = chanName;
  if (!title) title = original;
  return { title, artist, origArtist, cover };
}

/* ---------- LRC lyrics ---------- */

const TIME_TAG = /^\s*\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/;
const tagToSec = m => (+m[1]) * 60 + (+m[2]) + (m[3] ? parseFloat('0.' + m[3]) : 0);

function parseWordTags(s) {
  const parts = String(s).split(/<(\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?)>/);
  if (parts.length < 3) return { text: String(s).trim(), words: null };
  const words = [];
  if (parts[0]) words.push({ t: null, text: parts[0] });
  for (let i = 1; i < parts.length; i += 2) {
    const m = parts[i].match(/(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?/);
    const text = parts[i + 1] || '';
    if (text) words.push({ t: tagToSec(m), text });
  }
  const text = words.map(w => w.text).join('').replace(/\s+/g, ' ').trim();
  return { text, words: words.length ? words : null };
}

function parseLRC(text) {
  const rows = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const meta = {};
  let offsetMs = 0;
  const timed = [], plain = [];
  for (const row of rows) {
    const mt = row.match(/^\s*\[([a-zA-Z#]+)\s*:([^\]]*)\]\s*$/);
    if (mt) {
      const k = mt[1].toLowerCase();
      meta[k] = mt[2].trim();
      if (k === 'offset') offsetMs = parseInt(mt[2], 10) || 0;
      continue;
    }
    let rest = row, m;
    const times = [];
    while ((m = rest.match(TIME_TAG))) { times.push(tagToSec(m)); rest = rest.slice(m[0].length); }
    if (!times.length) { plain.push(row.trim()); continue; }
    const p = parseWordTags(rest);
    for (const t of times) {
      timed.push({ t, text: p.text, words: p.words ? p.words.map(w => ({ t: w.t == null ? t : w.t, text: w.text })) : null });
    }
  }
  if (!timed.length) {
    const lines = [];
    for (const t of plain) { if (!t && (!lines.length || !lines[lines.length - 1])) continue; lines.push(t); }
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    return { synced: false, lines: lines.map(t => ({ t: null, text: t, words: null })), meta };
  }
  const shift = offsetMs / 1000;
  for (const l of timed) {
    l.t = Math.max(0, round2(l.t - shift));
    if (l.words) l.words.forEach(w => { w.t = Math.max(0, round2(w.t - shift)); });
  }
  timed.sort((a, b) => a.t - b.t);
  const lines = [];
  for (const l of timed) {
    if (!l.text && (!lines.length || !lines[lines.length - 1].text)) continue;
    lines.push(l);
  }
  while (lines.length && !lines[lines.length - 1].text) lines.pop();
  return { synced: true, lines, meta };
}

function lrcTime(t) {
  const cs = Math.max(0, Math.round(t * 100));
  const m = Math.floor(cs / 6000), s = (cs % 6000) / 100;
  return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`;
}

function serializeLRC(lines, meta = {}) {
  const head = ['ti', 'ar', 'al', 'by'].filter(k => meta[k]).map(k => `[${k}:${String(meta[k]).replace(/[\[\]]/g, '')}]`);
  const body = lines.filter(l => l.t != null).sort((a, b) => a.t - b.t).map(l => `[${lrcTime(l.t)}]${l.text}`);
  return head.concat(body).join('\n');
}

/* Index of the last line whose time is <= t (-1 before the first line) */
function lineIndexAt(lines, t) {
  let lo = 0, hi = lines.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (lines[mid].t <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

/* ---------- LRCLIB matching ---------- */

function stripForQuery(t) {
  const s = String(t || '')
    .replace(/【[^】]*】|\[[^\]]*\]|\([^)]*\)|（[^）]*）|〔[^〕]*〕/g, ' ')
    .replace(/\s+(?:feat\.?|ft\.?|with)\s+.+$/i, '')
    .replace(/\s+/g, ' ').trim();
  return s || String(t || '').trim();
}

function lyricQuery(song) {
  const lq = song.lq || {};
  const track = (lq.track || '').trim() || stripForQuery(song.title);
  const artist = lq.artist !== undefined ? lq.artist : (song.origArtist || (song.cover ? '' : song.artist || ''));
  return { track, artist: artist ? stripForQuery(artist) : '' };
}

function scoreLyric(r, track, artist, dur) {
  if (!r || r.instrumental) return -1000;
  const hasSync = !!r.syncedLyrics, hasPlain = !!r.plainLyrics;
  if (!hasSync && !hasPlain) return -1000;
  let s = hasSync ? 60 : 12;
  const nt = norm(track), nr = norm(r.trackName || r.name);
  if (nt && nr) {
    if (nr === nt) s += 40;
    else if (nr.includes(nt) || nt.includes(nr)) s += 16;
    else s -= 30;
  }
  const na = norm(artist), nra = norm(r.artistName);
  if (na && nra) {
    if (nra === na) s += 22;
    else if (nra.includes(na) || na.includes(nra)) s += 14;
    else s -= 6;
  }
  if (dur > 0 && r.duration > 0) {
    const d = dur - r.duration; // > 0: the video runs longer (MV intros/outros are common)
    s -= d >= 0 ? Math.min(45, Math.max(0, d - 4) * 0.9) : Math.min(60, Math.max(0, -d - 2) * 2);
  }
  return s;
}

function pickLyric(results, track, artist, dur, min = 50) {
  let best = null, bestScore = -Infinity;
  for (const r of results || []) {
    const sc = scoreLyric(r, track, artist, dur);
    if (sc > bestScore) { best = r; bestScore = sc; }
  }
  return best && bestScore >= min ? { rec: best, score: bestScore } : null;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    clamp, unique, esc, norm, round1, fmtTime, fmtLong, fmtOffset, relTime, isoDur, detectScript, baseLang, sameLang,
    parseYouTubeInput, isNoiseTag, cleanPart, parseVideoTitle, parseLRC, serializeLRC, lrcTime, lineIndexAt,
    stripForQuery, lyricQuery, scoreLyric, pickLyric,
  };
}

function downloadFile(name, content, type = 'text/plain') {

}

async function runPool(tasks, n) {
  let i = 0;
  const worker = async () => {
    while (i < tasks.length) {
      const task = tasks[i++];
      try { await task(); } catch (e) { console.warn(e); }
    }
  };
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
}

const Store = {

  defaults() {
    return {
      v: 1,
      songs: {},
      order: [],
      likes: [],
      playlists: [],
      history: [],
      settings: {
        tl: 'zh-TW', showTrans: true, autoTrans: true, autoLyrics: true, lyricTrans: false,
        apiKey: '', volume: 80, muted: false, rate: 1, showVideo: true, lyricScale: 1, sort: 'added',
      },
      queue: { ids: [], ordered: [], index: -1, shuffle: false, repeat: 'off', ctx: null, pos: 0 },
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { d = null; }
    const def = this.defaults();
    if (!d || typeof d !== 'object') d = def;
    d.settings = { ...def.settings, ...(d.settings || {}) };
    d.queue = { ...def.queue, ...(d.queue || {}) };
    if (!d.songs || typeof d.songs !== 'object') d.songs = {};
    for (const k of ['order', 'likes', 'playlists', 'history']) if (!Array.isArray(d[k])) d[k] = [];
    for (const k of ['ids', 'ordered']) if (!Array.isArray(d.queue[k])) d.queue[k] = [];
    this.data = d;
    this.prune();
  },
  /* Drop songs nothing refers to, and references to songs that no longer exist */
  prune() {
    const d = this.data;
    const has = id => !!d.songs[id];
    d.order = unique(d.order.filter(has));
    d.likes = unique(d.likes.filter(has));
    d.history = d.history.filter(h => h && has(h.id));
    d.playlists = d.playlists.filter(p => p && p.id);
    d.playlists.forEach(p => { p.songs = (p.songs || []).filter(has); p.name = p.name || '未命名播放清單'; });
    const q = d.queue, cur = q.ids[q.index];
    q.ids = q.ids.filter(has);
    q.ordered = q.ordered.filter(has);
    q.index = cur && has(cur) ? q.ids.indexOf(cur) : Math.min(q.index, q.ids.length - 1);
    const keep = new Set([...d.order, ...d.likes, ...q.ids, ...d.history.map(h => h.id)]);
    d.playlists.forEach(p => p.songs.forEach(id => keep.add(id)));
    for (const id of Object.keys(d.songs)) if (!keep.has(id)) delete d.songs[id];
  },
  write() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
      this.failed = false;
    } catch (e) {
      if (!this.failed) { this.failed = true; toast('無法儲存：瀏覽器的儲存空間已滿或被停用'); }
    }
  },
};
Store.save = debounce(() => Store.write(), 300);

/* ---------- IndexedDB key-value store (lyrics cache) ---------- */

const KV = (() => {
  const mem = new Map();
  let dbp = null;
  const open = () => {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const r = indexedDB.open('liner', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  };
  const req = (mode, fn) => open().then(db => {
    if (!db) return undefined;
    return new Promise(res => {
      try {
        const tx = db.transaction('kv', mode);
        const r = fn(tx.objectStore('kv'));
        tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
        tx.onerror = tx.onabort = () => res(undefined);
      } catch (e) { res(undefined); }
    });
  });
  return {
    async get(k) {
      if (mem.has(k)) return mem.get(k);
      const v = await req('readonly', s => s.get(k));
      if (v !== undefined) mem.set(k, v);
      return v;
    },
    async set(k, v) { mem.set(k, v); await req('readwrite', s => s.put(v, k)); },
    async del(k) { mem.delete(k); await req('readwrite', s => s.delete(k)); },
    async entries(prefix = '') {
      const db = await open();
      const out = {};
      if (!db) { mem.forEach((v, k) => { if (k.startsWith(prefix)) out[k] = v; }); return out; }
      const [keys, vals] = await Promise.all([req('readonly', s => s.getAllKeys()), req('readonly', s => s.getAll())]);
      (keys || []).forEach((k, i) => { if (String(k).startsWith(prefix)) out[k] = vals[i]; });
      return out;
    },
    async clear(prefix = '') {
      const all = await this.entries(prefix);
      for (const k of Object.keys(all)) await this.del(k);
    },
  };
})();

/* ---------- Library model ---------- */

const Lib = {
  likeSet: new Set(),
  libSet: new Set(),
  sync() {
    this.likeSet = new Set(Store.data.likes);
    this.libSet = new Set(Store.data.order);
  },
  isLiked(id) { return this.likeSet.has(id); },
  inLib(id) { return this.libSet.has(id); },
  /* Adds in the given order so ids[0] ends up first (newest) */
  addMany(ids) {
    const fresh = ids.filter(id => song(id) && !this.libSet.has(id));
    const now = Date.now();
    fresh.forEach((id, i) => { song(id).added = now - i; this.libSet.add(id); });
    Store.data.order.unshift(...fresh);
    return fresh.length;
  },
  toggleLike(id) {
    const d = Store.data;
    if (this.likeSet.has(id)) {
      d.likes = d.likes.filter(x => x !== id);
      this.likeSet.delete(id);
      return false;
    }
    d.likes.unshift(id);
    this.likeSet.add(id);
    this.addMany([id]);
    return true;
  },
  remove(id) {
    const d = Store.data;
    d.order = d.order.filter(x => x !== id);
    d.likes = d.likes.filter(x => x !== id);
    d.playlists.forEach(p => { p.songs = p.songs.filter(x => x !== id); });
    this.sync();
  },
  playlist(id) { return Store.data.playlists.find(p => p.id === id) || null; },
  createPlaylist(name, desc = '') {
    const p = { id: uid(), name: String(name || '').trim() || '新的播放清單', desc, songs: [], created: Date.now(), updated: Date.now() };
    Store.data.playlists.unshift(p);
    return p;
  },
  addToPlaylist(plId, ids) {
    const p = this.playlist(plId);
    if (!p) return 0;
    const have = new Set(p.songs);
    const fresh = unique(ids).filter(id => song(id) && !have.has(id));
    p.songs.push(...fresh);
    p.updated = Date.now();
    this.addMany(fresh);
    return fresh.length;
  },
};

/* ---------- Toasts ---------- */

function toast(msg, opts = {}) {
  const box = $('#toasts');
  if (!box) return () => {};
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  let timer = null;
  const dismiss = () => {
    clearTimeout(timer);
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  };
  if (opts.action) {
    const a = opts.action;
    const b = document.createElement(a.href ? 'a' : 'button');
    if (a.href) { b.href = a.href; b.target = '_blank'; b.rel = 'noopener'; } else b.type = 'button';
    b.textContent = a.label;
    b.addEventListener('click', () => { if (a.run) a.run(); dismiss(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  timer = setTimeout(dismiss, opts.ms || (opts.action ? 6500 : 3200));
  return dismiss;
}

const Menu = {

  open(items, at) {
    this.close();

    this.place(el, at);
    this.el = el;
    const first = el.querySelector('.menu-item:not([disabled])');
    if (first && !coarse()) first.focus({ preventScroll: true });
  },
  build(items, isSub) {
    const el = document.createElement('div');
    el.className = 'menu';
    el.setAttribute('role', 'menu');
    for (const it of items) {
      if (!it) continue;
      if (it.sep) { el.insertAdjacentHTML('beforeend', '<div class="menu-sep" role="separator"></div>'); continue; }
      if (it.header) { el.insertAdjacentHTML('beforeend', `<div class="menu-label">${esc(it.header)}</div>`); continue; }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'menu-item' + (it.danger ? ' danger' : '');
      b.setAttribute('role', it.checked !== undefined ? 'menuitemradio' : 'menuitem');
      if (it.checked !== undefined) b.setAttribute('aria-checked', it.checked ? 'true' : 'false');
      b.innerHTML = `${it.icon ? ic(it.icon) : '<span class="i"></span>'}<span class="ml"${it.lang || ''}>${esc(it.label)}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}${it.checked ? ic('check', 'chk') : ''}${it.sub ? ic('chevron-right', 'chk') : ''}`;
      if (it.disabled) b.disabled = true;
      if (it.sub) {
        b.setAttribute('aria-haspopup', 'menu');
        const openSub = e => { if (e) e.stopPropagation(); this.openSub(it.sub(), b); };
        b.addEventListener('click', openSub);
        b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') openSub(); });
      } else {
        b.addEventListener('click', e => { e.stopPropagation(); this.close(); if (it.run) it.run(); });
        if (!isSub) b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') this.closeSub(); });
      }
      el.appendChild(b);
    }
    el.addEventListener('keydown', e => this.onKey(e, el));
    return el;
  },
  openSub(items, anchor) {
    this.closeSub();
    const el = this.build(items, true);
    $('#menuLayer').appendChild(el);
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = r.right + 4;
    if (x + w > innerWidth - 8) x = Math.max(8, r.left - w - 4);
    const y = clamp(r.top - 6, 8, innerHeight - h - 8);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    this.sub = el;
    anchor.classList.add('hl');
  },
  closeSub() {
    if (this.sub) { this.sub.remove(); this.sub = null; }
    if (this.el) $$('.menu-item.hl', this.el).forEach(b => b.classList.remove('hl'));
  },
  place(el, at) {
    const w = el.offsetWidth, h = el.offsetHeight;
    let x, y;
    if (at instanceof Element) {
      const r = at.getBoundingClientRect();
      x = r.right - w;
      y = r.bottom + 6;
      if (x < 8) x = r.left;
      if (y + h > innerHeight - 8) {
        const above = r.top - h - 6;
        y = above >= 8 ? above : innerHeight - h - 8;
      }
    } else {
      x = at.x; y = at.y;
      if (x + w > innerWidth - 8) x = at.x - w;
      if (y + h > innerHeight - 8) y = at.y - h;
    }
    el.style.left = clamp(x, 8, Math.max(8, innerWidth - w - 8)) + 'px';
    el.style.top = clamp(y, 8, Math.max(8, innerHeight - h - 8)) + 'px';
  },
  onKey(e, el) {
    const items = $$('.menu-item:not([disabled])', el);
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
    else if (e.key === 'ArrowRight' && document.activeElement.getAttribute('aria-haspopup')) { e.preventDefault(); document.activeElement.click(); const f = this.sub && this.sub.querySelector('.menu-item'); if (f) f.focus(); }
    else if (e.key === 'ArrowLeft' && el === this.sub) { e.preventDefault(); const hl = this.el && this.el.querySelector('.menu-item.hl'); this.closeSub(); if (hl) hl.focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.close(); }
    else if (e.key === 'Tab') { this.close(); }
  },
  close() {
    this.closeSub();
    if (this.el) { this.el.remove(); this.el = null; }
  },
  get isOpen() { return !!this.el; },
};

/* ---------- Dialogs ---------- */

const Modal = {
  stack: [],
  open({ title, body, foot = '', wide = false, cls = '', onKey = null, onClose = null, init = null, autoFocus = true }) {
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal${wide ? ' wide' : ''}${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <header class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" type="button" data-m="close" aria-label="關閉">${ic('x')}</button></header>
      <div class="modal-body">${body}</div>
      ${foot ? `<footer class="modal-foot">${foot}</footer>` : ''}
    </div>`;
    $('#modalLayer').appendChild(back);
    const m = { el: back.firstElementChild, back, onKey, onClose, prevFocus: document.activeElement };
    m.close = () => this.close(m);
    m.$ = s => m.el.querySelector(s);
    let downOnBack = false;
    back.addEventListener('pointerdown', e => { downOnBack = e.target === back; });
    back.addEventListener('click', e => { if (e.target === back && downOnBack) m.close(); downOnBack = false; });
    m.$('[data-m="close"]').addEventListener('click', () => m.close());
    this.stack.push(m);
    Menu.close();
    if (init) init(m);
    const f = m.el.querySelector('[autofocus]') || (autoFocus ? m.el.querySelector('.modal-body input:not([type=hidden]):not([type=checkbox]), .modal-body textarea') : null);
    if (f && !coarse()) f.focus();
    else m.$('[data-m="close"]').focus({ preventScroll: true });
    return m;
  },
  close(m) {
    const i = this.stack.indexOf(m);
    if (i < 0) return;
    this.stack.splice(i, 1);
    m.back.remove();
    if (m.onClose) m.onClose();
    if (m.prevFocus && m.prevFocus.focus && document.contains(m.prevFocus)) m.prevFocus.focus({ preventScroll: true });
  },
  get top() { return this.stack[this.stack.length - 1] || null; },
};

function confirmDialog({ title, body = '', ok = '確定', cancel = '取消', danger = false }) {
